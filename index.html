      ${p.note?`<p style="margin:11px 0 0;color:var(--tinta-70)">📝 ${esc(p.note)}</p>`:""}</div>
    ${p.status==="cancelled" ? `<div class="aviso rojo">Pedido cancelado. Motivo: ${esc(p.cancellationReason||"sin motivo")}</div>` : `
    <div class="bloque"><p class="bloque-t">Entrega</p>
      ${cli&&cli.deliveryAddress?`<p style="margin:0 0 8px;color:var(--tinta-70)">${esc(cli.deliveryAddress)}</p>`:""}
      ${cli&&cli.phone?`<p style="margin:0 0 11px;color:var(--tinta-70)">Tel. ${esc(cli.phone)}</p>`:""}
      ${mapa?`<button class="btn claro chico" id="d-mapa">Cómo llegar</button>`
            :`<p class="pista" style="color:var(--tinta-40);font-size:13px;margin:0">Sin ubicación guardada. Agrégala en Clientes.</p>`}</div>
    <div class="bloque"><p class="bloque-t">Estado</p>
      <div class="par"><button id="e-pend" aria-pressed="${p.status!=="delivered"}">Por entregar</button>
        <button id="e-ent" aria-pressed="${p.status==="delivered"}">Entregado</button></div>
      ${venta?`<div class="lin" style="margin-top:13px;border-top:1px solid var(--linea);padding-top:13px">
          <span>Venta ${venta.folio} · ${ETIQ_PAGO[ep]}</span><b>${pesos(venta.totalCents)}</b></div>
        <button class="btn claro chico" id="ir-venta" style="margin-top:10px">Ver venta y cobros</button>`
        :`<p class="pista" style="color:var(--tinta-40);font-size:13px;margin:11px 0 0">Al entregar se confirma el peso final, se crea la venta y se descuenta el inventario.</p>`}</div>`}
    <div class="acciones">
      ${p.status==="cancelled"||p.saleId?"":`<button class="btn claro" id="d-edit">Editar pedido</button>`}
      <button class="btn claro" id="d-wa">Mandar por WhatsApp</button>
      ${p.status==="cancelled"?"":`<button class="btn claro" id="d-cancel" style="color:var(--rojo)">Cancelar pedido</button>`}
    </div>`;
  const m=$("d-mapa"); if(m) m.onclick=()=>window.open(mapa,"_blank");
  const iv=$("ir-venta"); if(iv) iv.onclick=()=>abrirDetalleVenta(venta.id);
  const ed=$("d-edit"); if(ed) ed.onclick=()=>{ cerrarHoja(); abrirCapturaPedido(p.id); };
  const bp=$("e-pend");
  if(bp) bp.onclick = async ()=>{
    if(p.status!=="delivered") return;
    p.status="pending"; p.deliveredAt=null; p.updatedAt=ahora();
    await guardar();
    aviso(p.saleId?"Regresó a por entregar. La venta ligada se conserva.":"Regresó a por entregar.");
    pintarDetallePedido(f,id); refrescar();
  };
  const be=$("e-ent");
  if(be) be.onclick = ()=>{
    if(p.status==="delivered") return;
    if(p.saleId){
      p.status="delivered"; p.deliveredAt=ahora(); p.updatedAt=ahora();
      guardar().then(()=>{ aviso("Entregado. Ya tenía venta, no se duplicó."); pintarDetallePedido(f,id); refrescar(); });
      return;
    }
    abrirConfirmarEntrega(p, ()=>{ pintarDetallePedido(f,id); refrescar(); });
  };
  $("d-wa").onclick = ()=>{
    const t = `*${D.settings.negocio}*\nPedido ${p.folio} · ${p.customerNameSnapshot}\n${fechaLarga(p.deliveryDate)} · ${p.packaging==="vacio"?"Al vacío":"Envoltura normal"}\n\n`
      + p.items.map(i=>`• ${textoRenglon(i)} — ${pesos(i.subtotalCents)}`).join("\n")
      + `\n\n*Total aprox: ${pesos(p.totalCents)}*\n_El total puede variar un poco según el peso final._`
      + (p.note?`\n\nNota: ${p.note}`:"") + `\n\n¿Está bien así? 🧀`;
    const tel = cli ? telWhats(cli.phone) : "";
    window.open((tel?`https://wa.me/${tel}?text=`:"https://wa.me/?text=")+encodeURIComponent(t),"_blank");
  };
  const dc=$("d-cancel");
  if(dc) dc.onclick = ()=>pedirMotivo("Cancelar pedido", async mo=>{
    p.status="cancelled"; p.cancellationReason=mo; p.updatedAt=ahora();
    revertirStock(D, p, "pedido cancelado");
    const v = ventaDePedido(p);
    if(v && v.status==="active"){
      v.status="cancelled"; v.cancellationReason="Pedido cancelado: "+mo; tocar(v);
      devolverVenta(D, v);
      D.payments.filter(x=>x.saleId===v.id).forEach(x=>{ x.status="cancelled"; tocar(x); });
    }
    await guardar(); aviso("Pedido cancelado. El inventario regresó.");
    pintarDetallePedido(f,id); refrescar();
  });
}

function pedirMotivo(titulo, alConfirmar){
  abrirHoja({titulo, pie:true, render:f=>{
    f.cuerpo.innerHTML = `<h2 class="pregunta">${esc(titulo)}</h2>
      <p class="ayuda">No se borra nada: queda el registro con su motivo.</p>
      <div class="campo"><label>Motivo</label>
        <textarea class="txt" id="mot" rows="3" placeholder="Ej. el cliente ya no lo quiso"></textarea></div>`;
    f.pie.innerHTML = `<button class="btn" id="mot-ok" style="background:var(--rojo)">Confirmar</button>`;
    $("mot-ok").onclick = async ()=>{ const m = $("mot").value.trim()||"Sin motivo"; cerrarHoja(); await alConfirmar(m); };
  }});
}

/* ══ confirmar entrega → venta (una sola vez) ══ */
function abrirConfirmarEntrega(p, alTerminar){
  let ajuste = p.items.map(i=>clon(i));
  let editando = false;
  abrirHoja({titulo:"Entregar pedido", pie:true, render:f=>{
    const pintar = ()=>{
      const t = sumaRenglones(ajuste);
      f.cuerpo.innerHTML = `<h2 class="pregunta">${esc(p.customerNameSnapshot)}</h2>
        <p class="ayuda">${p.folio} · ${fechaLarga(p.deliveryDate)} · ${p.packaging==="vacio"?"Al vacío":"Envoltura normal"}</p>
        <div class="res">${bloqueRenglones(ajuste)}</div>
        ${editando ? `
          <div class="bloque"><p class="bloque-t">Peso real de la báscula</p>
            ${ajuste.map((i,ix)=> i.unit==="kg" || i.unit==="porción" || i.quantity!==Math.round(i.quantity) ? `
              <div class="campo"><label>${esc(i.nameSnapshot)}</label>
                <div class="cont"><button class="paso" data-m="${ix}">−</button>
                  <input class="num centro" data-q="${ix}" type="number" inputmode="decimal"
                    step="${i.unit==="kg"?SALTO:1}" min="0"
                    value="${i.unit==="kg" ? Math.round(i.quantity*1000) : i.quantity}">
                  <span class="uni-l">${i.unit==="kg"?"g":UNI_CORTA.piece}</span>
                  <button class="paso" data-p="${ix}">+</button></div></div>` : `
              <div class="campo"><label>${esc(i.nameSnapshot)}</label>
                <div class="cont"><button class="paso" data-m="${ix}">−</button>
                  <input class="num centro" data-q="${ix}" type="number" inputmode="numeric" step="1" min="0" value="${i.quantity}">
                  <span class="uni-l">${esc(i.unit)}</span>
                  <button class="paso" data-p="${ix}">+</button></div></div>`).join("")}
          </div>`
        : `<button class="btn claro chico" id="ent-ajustar">El peso cambió · ajustar</button>`}
        <div class="aviso" style="margin-top:14px">El inventario ya se apartó cuando levantaste el pedido. Aquí solo se genera la venta.</div>`;

      const aj = $("ent-ajustar");
      if(aj) aj.onclick = ()=>{ editando = true; pintar(); };
      const recalc = ix=>{
        const i = ajuste[ix];
        const v = Math.max(0, Number(f.cuerpo.querySelector(`[data-q="${ix}"]`).value)||0);
        const q = i.unit==="kg" ? v/1000 : v;
        ajuste[ix] = armarRenglon(Object.assign({}, i, {quantity:q,
          gramos: i.unit==="kg" ? v : (i.unit==="porción" ? i.gramos : null),
          piezas: i.unit==="kg" ? null : i.piezas,
          stockUnits: i.unit==="porción" ? (i.tamano*q)/1000 : q}));
        pintar();
      };
      f.cuerpo.querySelectorAll("[data-q]").forEach(el=>el.onchange=()=>recalc(Number(el.dataset.q)));
      f.cuerpo.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
        const ix=Number(b.dataset.m), el=f.cuerpo.querySelector(`[data-q="${ix}"]`);
        el.value = Math.max(0,(Number(el.value)||0)-(ajuste[ix].unit==="kg"?SALTO:1)); recalc(ix); });
      f.cuerpo.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
        const ix=Number(b.dataset.p), el=f.cuerpo.querySelector(`[data-q="${ix}"]`);
        el.value = (Number(el.value)||0)+(ajuste[ix].unit==="kg"?SALTO:1); recalc(ix); });
    };
    pintar();
    f.pie.innerHTML = `<button class="btn" id="ent-ok">Confirmar y crear venta</button>`;
    $("ent-ok").onclick = async ()=>{
      if(p.saleId){ aviso("Este pedido ya tenía venta."); cerrarHoja(); return; }
      reajustarStock(D, p, ajuste, "ajuste al entregar");
      const t = sumaRenglones(p.items);
      p.subtotalCents=t.subtotal; p.taxCents=t.tax; p.totalCents=t.subtotal+t.tax;
      p.status="delivered"; p.deliveredAt=ahora(); p.updatedAt=ahora();
      const venta = ventaDesde(D, p, {soldAt:HOY()});
      venta.stockAplicado = true;       // el inventario ya se descontó con el pedido
      p.stockAplicado = false;          // la responsabilidad pasa a la venta
      D.sales.push(venta); p.saleId = venta.id; tocar(venta);
      await guardar();
      cerrarHoja();
      if(alTerminar) alTerminar();
      abrirCobro(venta.id);
    };
  }});
}

/* ══ cobro ══ */
function abrirCobro(saleId){
  const v = D.sales.find(x=>x.id===saleId); if(!v) return;
  let metodo="cash", monto=saldoDe(v);
  abrirHoja({titulo:"Registrar cobro", pie:true, render:f=>{
    const pintar = ()=>{
      const saldo = saldoDe(v);
      f.cuerpo.innerHTML = `<h2 class="pregunta">${esc(v.customerNameSnapshot)}</h2>
        <p class="ayuda">${v.folio} · total ${pesos(v.totalCents)}</p>
        <div class="bloque oscuro"><p class="bloque-t">Saldo pendiente</p>
          <div class="cifra nt">${pesos(saldo)}</div></div>
        <div class="campo"><label>Método</label>
          <div class="par">${METODOS_LISTA.map(m=>
            `<button data-met="${m}" aria-pressed="${metodo===m}">${METODOS[m]}</button>`).join("")}</div></div>
        <div class="campo"><label>Monto</label>
          <div class="con-uni"><input class="num" id="co-m" type="number" inputmode="decimal" min="0" step="1" value="${deCent(Math.min(monto,saldo))}"><span class="uni">MXN</span></div>
          <p class="pista">Máximo el saldo: ${pesos(saldo)}.</p></div>
        ${pagosDe(v.id).length?`<div class="bloque"><p class="bloque-t">Cobros registrados</p>
          ${pagosDe(v.id).map(p=>`<div class="lin"><span>${fechaCorta(p.paidAt)} · ${METODOS[p.method]}</span><b>${pesos(p.amountCents)}</b></div>`).join("")}</div>`:""}`;
      f.cuerpo.querySelectorAll("[data-met]").forEach(b=>b.onclick=()=>{ metodo=b.dataset.met; pintar(); });
      $("co-m").oninput = e=>{ monto = Math.min(aCent(e.target.value), saldoDe(v)); };
      $("co-ok").disabled = saldo<=0;
    };
    f.pie.innerHTML = `<button class="btn" id="co-ok">Registrar cobro</button>`;
    pintar();
    $("co-ok").onclick = async ()=>{
      const m = Math.max(0, Math.min(monto, saldoDe(v)));
      if(m<=0){ aviso("El monto debe ser mayor a cero","err"); return; }
      if(m < saldoDe(v) && !v.customerId){
        const n = (prompt("Va a quedar un saldo. ¿A nombre de quién?")||"").trim();
        if(!n){ aviso("Sin nombre no se puede dejar saldo","err"); return; }
        const cl = altaClienteRapida(n, v.priceTier);
        v.customerId = cl.id; v.customerNameSnapshot = cl.displayName;
      }
      D.payments.push({id:uid("pay"), saleId:v.id, amountCents:m, method:metodo,
        reference:"", paidAt:HOY(), note:"", status:"active", updatedAt:ahora()});
      await guardar(); cerrarHoja();
      aviso(saldoDe(v)>0 ? `Pago parcial. Falta ${pesos(saldoDe(v))}` : "Venta liquidada","ok");
      refrescar();
    };
  }});
}

/* ══ detalle de venta ══ */
function abrirDetalleVenta(id){ abrirHoja({titulo:"Venta", render:f=>pintarDetalleVenta(f,id)}); }
function pintarDetalleVenta(f, id){
  const v = D.sales.find(x=>x.id===id); if(!v){ cerrarHoja(); return; }
  const pagos = pagosDe(v.id), saldo = saldoDe(v), ep = estadoPago(v);
  f.cuerpo.innerHTML = `
    <div class="res"><div class="res-nom">${esc(v.customerNameSnapshot)}</div>
      <div class="res-sub">${v.folio} · ${fechaLarga(v.soldAt)} · ${v.priceTier==="wholesale"?"mayoreo":"menudeo"}</div>
      ${bloqueRenglones(v.items,{discountCents:v.discountCents})}</div>
    ${v.status==="cancelled"?`<div class="aviso rojo">Venta cancelada. ${esc(v.cancellationReason||"")}</div>`:`
    <div class="bloque"><p class="bloque-t">Cobros</p>
      ${pagos.length? pagos.map(p=>`<div class="lin"><span>${fechaCorta(p.paidAt)} · ${METODOS[p.method]}</span><b>${pesos(p.amountCents)}</b></div>`).join("")
        :`<p class="ayuda" style="margin:0">Todavía sin cobros.</p>`}
      <div class="lin total"><span>${ep==="paid"?"Liquidada":"Saldo"}</span><b>${pesos(saldo)}</b></div>
      ${saldo>0?`<button class="btn" id="v-cobrar" style="margin-top:13px">Registrar cobro</button>`:""}</div>
    <div class="bloque"><p class="bloque-t">Factura</p>
      <div class="par"><button id="v-f-no" aria-pressed="${!v.invoiceRequested}">No requiere</button>
        <button id="v-f-si" aria-pressed="${v.invoiceRequested}">Sí requiere</button></div>
      ${v.invoiceRequested?`<p class="pista" style="margin-top:11px">Estado: <b>${EST_FACTURA[v.invoiceStatus]}</b>. Se administra en Más › Por facturar.</p>`:""}</div>
    <div class="acciones"><button class="btn claro" id="v-cancel" style="color:var(--rojo)">Cancelar venta</button></div>`}`;
  const c=$("v-cobrar"); if(c) c.onclick=()=>{ cerrarHoja(); abrirCobro(v.id); };
  const fs=$("v-f-si"), fn=$("v-f-no");
  if(fs) fs.onclick = async ()=>{
    v.invoiceRequested=true; tocar(v);
    if(v.invoiceStatus==="not_requested") v.invoiceStatus="pending";
    const cl = clientePorId(v.customerId);
    if(cl) v.fiscalCustomerSnapshot = {legalName:cl.legalName, rfc:cl.rfc, fiscalZipCode:cl.fiscalZipCode,
      fiscalRegime:cl.fiscalRegime, defaultCfdiUse:cl.defaultCfdiUse, billingEmail:cl.billingEmail};
    await guardar(); pintarDetalleVenta(f,id);
  };
  if(fn) fn.onclick = async ()=>{ v.invoiceRequested=false; v.invoiceStatus="not_requested"; tocar(v); await guardar(); pintarDetalleVenta(f,id); };
  const vc=$("v-cancel");
  if(vc) vc.onclick = ()=>pedirMotivo("Cancelar venta", async m=>{
    v.status="cancelled"; v.cancellationReason=m; tocar(v);
    devolverVenta(D, v);
    D.payments.filter(p=>p.saleId===v.id).forEach(p=>{ p.status="cancelled"; p.note=(p.note||"")+" · venta cancelada"; tocar(p); });
    const ped = D.orders.find(o=>o.saleId===v.id);
    if(ped){ ped.saleId=null; ped.status="pending"; ped.deliveredAt=null; ped.stockAplicado=false; }
    await guardar(); aviso("Venta cancelada. Se devolvió el inventario.");
    pintarDetalleVenta(f,id); refrescar();
  });
}

      f.cuerpo.innerHTML = `

        </div>
        <div class="rejilla2">
          <div class="campo"><label>${p.saleUnit==="kg"?"Costo por kilo":"Costo de compra"}</label><input class="num" id="p-c" type="number" inputmode="decimal" min="0" step="0.5" value="${deCent(p.unitCostCents)}">
            ${p.name==="Requesón"?`<p class="pista">${pesos(Math.round(p.unitCostCents/4))} por cuarto de kilo.</p>`:""}</div>
          <div class="campo"><label>Precio de venta</label><input class="num" id="p-pr" type="number" inputmode="decimal" min="0" step="0.5" value="${deCent(p.retailPriceCents)}"></div>
        </div>
        <div class="campo"><label>Precio mayoreo</label><input class="num" id="p-pm" type="number" inputmode="decimal" min="0" step="0.5" value="${p.wholesalePriceCents==null?0:deCent(p.wholesalePriceCents)}"></div>
        <div class="bloque oscuro">
          <div class="lin" style="margin:0;padding:0"><span style="color:#fff">Utilidad por unidad</span>
            <b style="font-family:'Bricolage Grotesque',sans-serif;font-size:20px">${p.costoDesconocido?"—":pesos(u)}</b></div>
          <div class="lin" style="padding:0"><span style="color:var(--verde)">Margen</span>
            <b style="color:var(--verde);font-family:'Bricolage Grotesque',sans-serif;font-size:20px">${p.costoDesconocido?"—":pct(u,p.retailPriceCents)}</b></div>
        </div>
        ${mal?`<div class="aviso rojo" style="margin-bottom:14px">El precio de venta no cubre el costo.</div>`:""}
        ${p.costoDesconocido?`<div class="aviso oro" style="margin-bottom:14px">Costo marcado como desconocido: la utilidad de este artículo no se puede calcular.</div>`:""}
        <label class="check-lin"><input type="checkbox" id="p-desc" ${p.costoDesconocido?"checked":""}> No conozco el costo todavía</label>
        <label class="check-lin"><input type="checkbox" id="p-act" ${p.active?"checked":""}> Activo</label>
        <div class="campo"><label>Color en listas</label><input class="txt" id="p-col" type="color" value="${p.color}" style="height:54px;padding:6px"></div>
        <details><summary>Para facturar (opcional)</summary>
          <div class="campo"><label>IVA %</label><input class="num" id="p-iva" type="number" inputmode="decimal" min="0" max="100" step="1" value="${Math.round(p.taxRate*100)}">
            <p class="pista">El queso y otros alimentos básicos van a 0%. Confírmalo con tu contador.</p></div>
          <div class="campo"><label>Clave producto SAT</label><input class="txt" id="p-sat" value="${esc(p.satProductCode)}"></div>
          <div class="campo"><label>Clave unidad SAT</label><input class="txt" id="p-satu" value="${esc(p.satUnitCode)}"></div>
          <div class="campo"><label>Objeto de impuesto</label><input class="txt" id="p-obj" value="${esc(p.taxObject)}"></div>
          <div class="campo"><label>Descripción fiscal</label><input class="txt" id="p-fd" value="${esc(p.fiscalDescription)}"></div>
        </details>
        ${orig ? (tieneHistoria(orig.id)
          ? `<div class="aviso" style="margin-top:14px">Este artículo ya tiene movimientos. No se puede borrar: desactívalo para sacarlo de las listas.</div>`
          : `<button class="btn claro" id="p-del" style="color:var(--rojo);margin-top:14px">Borrar producto</button>`) : ""}`;

      const leer = ()=>{
        p.name=$("p-n").value.trim(); p.category=$("p-cat").value.trim()||"Otros";
        p.saleUnit=$("p-uni").value;
        p.allowsFraction = (p.saleUnit==="kg"||p.saleUnit==="g");
        p.taxRate = Math.min(1, Math.max(0,(Number($("p-iva").value)||0)/100));
        p.unitCostCents = Math.max(0, aCent($("p-c").value));
        p.retailPriceCents = Math.max(0, aCent($("p-pr").value));
        const pm = aCent($("p-pm").value);
        p.wholesalePriceCents = pm>0 ? pm : null;
        p.costoDesconocido=$("p-desc").checked; p.active=$("p-act").checked;
        p.color=$("p-col").value;
        p.satProductCode=$("p-sat").value.trim(); p.satUnitCode=$("p-satu").value.trim();
        p.taxObject=$("p-obj").value.trim(); p.fiscalDescription=$("p-fd").value.trim();
      };
      f.cuerpo.__leer = leer;
      ["p-c","p-pr","p-desc","p-uni"].forEach(k=>{ const el=$(k); if(el) el.onchange=()=>{ leer(); pintar(); }; });
      const del=$("p-del");
      if(del) del.onclick = async ()=>{
        if(!confirm("¿Borrar este producto? No tiene movimientos.")) return;
        D.products = D.products.filter(x=>x.id!==orig.id);
        await guardar(); cerrarHoja(); aviso("Producto borrado");
      };
    };
    f.pie.innerHTML = `<button class="btn" id="p-ok">Guardar producto</button>`;
    pintar();
    $("p-ok").onclick = async ()=>{
      f.cuerpo.__leer();
      if(!p.name){ aviso("Ponle nombre al producto","err"); return; }
      p.updatedAt = ahora();
      if(orig){
        Object.assign(orig, p);
      } else D.products.push(p);
      await guardar(); cerrarHoja(); aviso("Producto guardado","ok"); refrescar();
    };
  }});
}

function abrirStock(){
  abrirHoja({titulo:"Stock", pie:true, render:f=>{
    const borradorSt = {};
    const pintar = ()=>{
      const l = D.products.filter(p=>p.active).sort((a,b)=>(bajoMinimo(b)?1:0)-(bajoMinimo(a)?1:0));
      const surtir = productosPorSurtir();
      f.cuerpo.innerHTML = `<h2 class="pregunta">Stock</h2>
        <p class="ayuda">Inventario disponible y mínimos.</p>
        <div class="bloque oscuro" style="display:flex;align-items:center;gap:14px">
          <div style="flex:1"><p class="bloque-t" style="margin-bottom:6px">Atención</p>
            <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800">${surtir.length} por surtir</div>
            <div style="color:var(--tinta-40);font-size:14px;margin-top:4px">${surtir.length?"Llegaron al mínimo o están por debajo.":"Todo por encima del mínimo."}</div></div>
          <span style="width:52px;height:52px;border-radius:13px;background:${surtir.length?"var(--oro)":"var(--verde)"};color:#fff;
            display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:none">${surtir.length?"!":"✓"}</span></div>
        ${l.map(p=>`<div class="bloque">
          <div class="f-top" style="margin-bottom:12px">
            <span class="punto-c" style="background:${p.color}"></span>
            <span style="flex:1"><span class="f-nom" style="display:block">${esc(p.name)}</span>
              <span class="f-det" style="margin:0">${esc(p.category)} · ${p.stock>0?"Disponible":"Agotado"}</span></span>
            <span class="etq ${bajoMinimo(p)?"oro":"suave"}">${bajoMinimo(p)?"POR SURTIR":"EN ORDEN"}</span></div>
          <div class="rejilla2">
            <div class="campo" style="margin:0"><label>Existencia</label>
              <div class="con-uni"><input class="num" data-st="${p.id}" type="number" inputmode="decimal" step="0.5" min="0" value="${p.stock==null?0:p.stock}"><span class="uni">${UNI_CORTA[p.saleUnit]}</span></div></div>
            <div class="campo" style="margin:0"><label>Avisar al llegar a</label>
              <div class="con-uni"><input class="num" data-min="${p.id}" type="number" inputmode="decimal" step="0.5" min="0" value="${p.minStock==null?0:p.minStock}"><span class="uni">${UNI_CORTA[p.saleUnit]}</span></div></div>
          </div></div>`).join("")}
        <div class="aviso">La existencia baja sola con cada venta y regresa si cancelas. Aquí solo corriges lo que contaste a mano.</div>`;
      f.cuerpo.querySelectorAll("[data-st]").forEach(el=>el.oninput=()=>{
        borradorSt[el.dataset.st] = borradorSt[el.dataset.st]||{};
        borradorSt[el.dataset.st].stock = Math.max(0, Number(el.value)||0); });
      f.cuerpo.querySelectorAll("[data-min]").forEach(el=>el.oninput=()=>{
        borradorSt[el.dataset.min] = borradorSt[el.dataset.min]||{};
        borradorSt[el.dataset.min].min = Math.max(0, Number(el.value)||0); });
    };
    f.pie.innerHTML = `<button class="btn" id="st-ok">Guardar inventario</button>`;
    pintar();
    $("st-ok").onclick = async ()=>{
      let n=0;
      Object.entries(borradorSt).forEach(([pid,val])=>{
        const p = D.products.find(x=>x.id===pid); if(!p) return;
        if(val.stock!=null && val.stock!==p.stock){
          D.stockMoves.push({id:uid("mov"), productId:pid, delta:val.stock-(p.stock||0),
            antes:p.stock, despues:val.stock, motivo:"conteo manual", ref:"", at:ahora(), date:HOY()});
          p.stock = val.stock; n++;
        }
        if(val.min!=null && val.min!==p.minStock){ p.minStock = val.min; n++; }
        p.updatedAt = ahora();
      });
      await guardar(); cerrarHoja();
      aviso(n?"Inventario actualizado":"Sin cambios","ok"); refrescar();
    };
  }});
}

/* ══════════════════════════════════════════════════════════
   CLIENTES · con importación desde la agenda del teléfono
   ══════════════════════════════════════════════════════════ */
const hayAgenda = () => !!(self.navigator && navigator.contacts && navigator.contacts.select);

async function traerDeAgenda(alTener){
  if(!hayAgenda()){
    aviso("Este teléfono no comparte la agenda. Escribe el nombre y el número.","err",5000);
    return;
  }
  try{
    const sel = await navigator.contacts.select(["name","tel"], {multiple:false});
    if(!sel || !sel.length) return;
    const c = sel[0];
    const nombre = (c.name && c.name[0]) ? String(c.name[0]).trim() : "";
    const tel = (c.tel && c.tel[0]) ? String(c.tel[0]).replace(/\D/g,"").slice(-10) : "";
    alTener({nombre, tel});
  }catch(e){
    if(e && e.name==="AbortError") return;
    aviso("No se pudo abrir la agenda.","err");
  }
}

function abrirClientes(){
  let q="";
  abrirHoja({titulo:"Clientes", pie:true, render:f=>{
    const pintar = ()=>{
      const l = D.customers.filter(c=>!q||normaliza(c.displayName).includes(normaliza(q)));
      f.cuerpo.innerHTML = `<h2 class="pregunta">Clientes</h2>
        <p class="ayuda">Guarda teléfono, precio y ubicación para cada ruta.</p>
        ${hayAgenda()?`<div class="import"><div><strong>Traer desde el teléfono</strong>
            <span>Selecciona un contacto y evita capturar nombre y número.</span></div>
          <button id="cl-agenda">Contactos</button></div>`:""}
        <input class="buscador" id="cl-q" placeholder="Buscar…" value="${esc(q)}">
        ${l.length? l.map(c=>`<button class="fila" data-c="${c.id}">
          <div class="f-top"><span class="avatar">${inicial(c.displayName)}</span>
            <span style="flex:1"><span class="f-nom" style="display:block">${esc(c.displayName)}</span>
              <span class="f-det" style="margin:0">${c.deliveryAddress?esc(c.deliveryAddress):"Sin ubicación"}${c.phone?" · "+esc(c.phone):""}</span></span>
            <span class="etq">${c.defaultPriceTier==="wholesale"?"MAYOREO":"MENUDEO"}</span></div>
          ${c.rfc?`<div class="f-pie"><span class="etq oro">RFC ${esc(c.rfc)}</span></div>`:""}</button>`).join("")
          : vacio("Sin clientes","Se dan de alta solos al capturar pedidos, o usa el botón de abajo.")}`;
      const bq = f.cuerpo.querySelector("#cl-q");
      bq.oninput = e=>{ const v=e.target.value; q=v; pintar();
        const n=f.cuerpo.querySelector("#cl-q"); n.focus(); n.setSelectionRange(v.length,v.length); };
      const btnAg = f.cuerpo.querySelector("#cl-agenda");
      if(btnAg) btnAg.onclick = ()=>traerDeAgenda(({nombre,tel})=>{
        const ex = clientePorNombre(nombre);
        if(ex){ aviso("Ese contacto ya está en tu lista"); abrirCliente(ex.id, pintar); return; }
        abrirCliente(null, pintar, {displayName:nombre, phone:tel});
      });
      f.cuerpo.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>abrirCliente(b.dataset.c, pintar));
    };
    f.pie.innerHTML = `<button class="btn" id="cl-nuevo">+ Nuevo cliente</button>`;
    $("cl-nuevo").onclick = ()=>abrirCliente(null, pintar);
    pintar();
  }});
}

function abrirCliente(id, alVolver, precarga){
  const orig = id ? clientePorId(id) : null;
  const c = orig ? clon(orig) : fichaCliente(precarga||{});
  abrirHoja({titulo: orig?"Editar cliente":"Nuevo cliente", pie:true, alCerrar:alVolver, render:f=>{
    f.cuerpo.innerHTML = `
      ${(!orig && hayAgenda())?`<div class="import"><div><strong>Traer desde el teléfono</strong>
        <span>Rellena nombre y número desde tu agenda.</span></div>
        <button id="c-agenda">Contactos</button></div>`:""}
      <div class="campo"><label>Nombre</label><input class="txt" id="c-n" value="${esc(c.displayName)}" placeholder="Abarrotes Lupita"></div>
      <div class="campo"><label>Teléfono (10 dígitos)</label><input class="txt" id="c-t" type="tel" inputmode="numeric" value="${esc(c.phone)}" placeholder="6141234567"></div>
      <div class="campo"><label>Precio que le corresponde</label>
        <div class="par"><button data-tier="wholesale" aria-pressed="${c.defaultPriceTier==="wholesale"}">Mayoreo</button>
          <button data-tier="retail" aria-pressed="${c.defaultPriceTier==="retail"}">Menudeo</button></div></div>
      <div class="campo"><label>Dirección de entrega</label>
        <textarea class="txt" id="c-d" rows="2" placeholder="Calle, número, colonia">${esc(c.deliveryAddress)}</textarea></div>
      <div class="campo"><label>Ubicación exacta</label>
        <p class="pista" id="c-gps" style="margin:0 0 10px">${c.lat!=null&&c.lng!=null?`Guardada (${Number(c.lat).toFixed(5)}, ${Number(c.lng).toFixed(5)})`:"Sin coordenadas"}</p>
        <button class="btn claro chico" id="c-gps-btn">Usar mi ubicación actual</button>
        <p class="pista">Estando afuera del domicilio, este botón guarda el punto exacto para el repartidor.</p></div>
      <div class="campo"><label>O enlace de Google Maps</label><input class="txt" id="c-m" value="${esc(c.mapsUrl)}" placeholder="https://maps.app.goo.gl/…"></div>
      <details ${c.rfc?"open":""}><summary>Datos fiscales (para facturar)</summary>
        <div class="campo"><label>Razón social</label><input class="txt" id="c-rs" value="${esc(c.legalName)}"></div>
        <div class="campo"><label>RFC</label><input class="txt" id="c-rfc" value="${esc(c.rfc)}" style="text-transform:uppercase"></div>
        <div class="campo"><label>CP fiscal</label><input class="txt" id="c-cp" inputmode="numeric" value="${esc(c.fiscalZipCode)}"></div>
        <div class="campo"><label>Régimen fiscal</label><input class="txt" id="c-reg" value="${esc(c.fiscalRegime)}" placeholder="601, 612…"></div>
        <div class="campo"><label>Uso de CFDI</label><input class="txt" id="c-uso" value="${esc(c.defaultCfdiUse)}" placeholder="G03"></div>
        <div class="campo"><label>Correo para facturas</label><input class="txt" id="c-mail" type="email" value="${esc(c.billingEmail)}"></div>
      </details>
      ${orig?`<button class="btn claro" id="c-del" style="color:var(--rojo);margin-top:14px">Borrar cliente</button>`:""}`;
    const ag = $("c-agenda");
    if(ag) ag.onclick = ()=>traerDeAgenda(({nombre,tel})=>{
      if(nombre) $("c-n").value = nombre;
      if(tel) $("c-t").value = tel;
      aviso("Contacto traído de la agenda","ok");
    });
    f.cuerpo.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>{
      c.defaultPriceTier=b.dataset.tier;
      f.cuerpo.querySelectorAll("[data-tier]").forEach(o=>o.setAttribute("aria-pressed", o===b)); });
    $("c-gps-btn").onclick = ()=>{
      const t=$("c-gps");
      if(!navigator.geolocation){ t.textContent="Este teléfono no comparte ubicación. Usa el enlace de Maps."; return; }
      t.textContent = "Buscando ubicación…";
      navigator.geolocation.getCurrentPosition(
        pos=>{ c.lat=pos.coords.latitude; c.lng=pos.coords.longitude;
          t.textContent=`Guardada (${c.lat.toFixed(5)}, ${c.lng.toFixed(5)})`; },
        ()=>{ t.textContent="No se pudo obtener. Pega el enlace de Google Maps."; },
        {enableHighAccuracy:true, timeout:10000});
    };
    const del=$("c-del");
    if(del) del.onclick = async ()=>{
      if(!confirm("¿Borrar este cliente? Los pedidos y ventas se conservan con el nombre que tenían.")) return;
      D.customers = D.customers.filter(x=>x.id!==orig.id);
      await guardar(); cerrarHoja(); aviso("Cliente borrado");
    };
    f.pie.innerHTML = `<button class="btn" id="c-ok">Guardar cliente</button>`;
    $("c-ok").onclick = async ()=>{
      c.displayName = $("c-n").value.trim();
      if(!c.displayName){ aviso("Ponle nombre al cliente","err"); return; }
      const dup = clientePorNombre(c.displayName);
      if(dup && dup.id!==c.id){ aviso("Ya existe un cliente con ese nombre","err"); return; }
      c.phone=$("c-t").value.trim(); c.deliveryAddress=$("c-d").value.trim(); c.mapsUrl=$("c-m").value.trim();
      c.legalName=$("c-rs").value.trim(); c.rfc=$("c-rfc").value.trim().toUpperCase();
      c.fiscalZipCode=$("c-cp").value.trim(); c.fiscalRegime=$("c-reg").value.trim();
      c.defaultCfdiUse=$("c-uso").value.trim(); c.billingEmail=$("c-mail").value.trim();
      c.updatedAt = ahora();
      if(orig){
        const antes = orig.displayName;
        Object.assign(orig, c);
        if(antes!==c.displayName) D.orders.forEach(o=>{ if(o.customerId===c.id) o.customerNameSnapshot=c.displayName; });
      } else D.customers.push(c);
      await guardar(); cerrarHoja(); aviso("Cliente guardado","ok"); refrescar();
    };
  }});
}

let perGastos="mes";
function pintarGastos(){
  const r = rangoPeriodo(perGastos);
  const l = D.expenses.filter(g=>enRango(g.date,r.desde,r.hasta)).sort((a,b)=>b.date.localeCompare(a.date));
  const total = l.filter(g=>g.status==="active").reduce((s,g)=>s+g.amountCents,0);
  const nom = id => (D.expenseCategories.find(c=>c.id===id)||{}).name || "Sin categoría";
  const porCat = {};
  l.filter(g=>g.status==="active").forEach(g=>porCat[nom(g.categoryId)] = (porCat[nom(g.categoryId)]||0)+g.amountCents);
  $("v-gastos").innerHTML = `<h1 class="titulo-v">Gastos</h1>
    <p class="sub-v">Lo que sale del negocio y no es mercancía vendida.</p>
    <div class="periodo">${[["hoy","Hoy"],["semana","Semana"],["mes","Mes"]].map(([k,t])=>
      `<button data-pg="${k}" aria-pressed="${perGastos===k}">${t}</button>`).join("")}</div>
    <div class="bloque oscuro"><p class="bloque-t">Total del periodo</p>
      <div class="cifra nt">${pesos(total)}</div></div>
    ${Object.keys(porCat).length?`<div class="bloque"><p class="bloque-t">Por categoría</p>
      ${Object.entries(porCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="lin"><span>${esc(k)}</span><b>${pesos(v)}</b></div>`).join("")}</div>`:""}
    <div class="aviso" style="margin-bottom:14px">El costo de la mercancía vendida ya se descuenta como <b>costo de ventas</b>. No lo registres otra vez aquí o contarías doble.</div>
    <button class="btn" id="nuevo-gasto" style="margin-bottom:14px">+ Registrar gasto</button>
    ${l.length? l.map(g=>`<button class="fila ${g.status==="cancelled"?"can":""}" data-g="${g.id}">
      <div class="f-top"><span class="f-nom">${esc(g.concept)}</span></div>
      <div class="f-det">${esc(nom(g.categoryId))}${g.supplier?" · "+esc(g.supplier):""}</div>
      <div class="f-pie"><span class="etq">${g.folio}</span>
        <span style="font-size:13px;color:var(--tinta-40)">${fechaCorta(g.date)}</span>
        <span class="etq">${METODOS[g.paymentMethod]||"Otro"}</span>
        ${g.receiptDataUrl?`<span class="etq">📎</span>`:""}
        ${g.status==="cancelled"?`<span class="etq gris">Cancelado</span>`:""}
        <span class="f-tot">${pesos(g.amountCents)}</span></div></button>`).join("")
      : vacio("Sin gastos en el periodo","Registra gasolina, luz, empaques o nómina para ver la utilidad real.")}`;
  $("v-gastos").querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{ perGastos=b.dataset.pg; pintarGastos(); });
  $("nuevo-gasto").onclick = ()=>abrirGasto(null);
  $("v-gastos").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>abrirGasto(b.dataset.g));
}

function abrirGasto(id, prefill){
  const orig = id ? D.expenses.find(g=>g.id===id) : null;
  const { foto, avisoRevision, ...prefillDatos } = prefill || {};
  const g = orig ? clon(orig) : Object.assign({id:uid("gas"), folio:null, date:HOY(), concept:"",
    categoryId:(D.expenseCategories[0]||{}).id, amountCents:0, paymentMethod:"cash",
    supplier:"", receiptDataUrl:"", note:"", status:"active", createdAt:ahora(), updatedAt:ahora()}, prefillDatos);
  abrirHoja({titulo: orig?"Gasto "+orig.folio:"Nuevo gasto", pie:true, render:f=>{
    f.cuerpo.innerHTML = `

      else { g.folio = folio("expense","GAS"); D.expenses.push(g); }
      await guardar(); cerrarHoja(); aviso("Gasto guardado","ok"); refrescar();

const DIAS_RESPALDO = 7;
function diasSinRespaldo(){
  const u = D.settings.ultimoRespaldo;
  if(!u) {
    const base = D.settings.creado || ahora();
    return Math.floor((Date.now()-new Date(base).getTime())/86400000);
  }
  return Math.floor((Date.now()-new Date(u).getTime())/86400000);
}
function tocaRespaldar(){
  if(!D.orders.length && !D.sales.length) return false;   // nada que perder todavía
  return diasSinRespaldo() >= DIAS_RESPALDO;
}
function avisoRespaldo(){
  if(!tocaRespaldar()) return "";

}

/* ══ respaldo ══ */
function bajarArchivo(blob, nombre){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=nombre; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(e){ console.error(e); aviso("Este navegador bloqueó la descarga.","err"); return false; }
}
async function crearRespaldo(){
  const ok = bajarArchivo(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),
    `respaldo-${(D.settings.negocio||"sierra-noble").toLowerCase().replace(/[^a-z0-9]+/g,"-")}-${HOY()}.json`);
  if(!ok) return;
  D.settings.ultimoRespaldo = ahora();
  await guardar();
  aviso("Respaldo descargado. Guárdalo en WhatsApp o correo.","ok",5000);
  refrescar();
}
function pedirRestaurar(){ $("m-file").click(); }
function restaurarDeArchivo(e){
  const file = e.target.files && e.target.files[0]; if(!file) return;
  if(file.size > 12*1024*1024){ aviso("El respaldo supera 12 MB","err"); return; }
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.products) || !Array.isArray(d.sales)) throw new Error("formato");
      if(!confirm("Esto reemplaza toda la información actual. ¿Continuar?")) return;
      D = migrarEsquema(d);
      await guardar();
      cerrarTodo();
      $("negocio").textContent = D.settings.negocio;
      irA("inicio");
      aviso("Respaldo restaurado","ok");
    }catch(err){ console.error(err); aviso("El archivo no es un respaldo válido","err"); }
    finally{ e.target.value=""; }
  };
  r.onerror = ()=>aviso("No se pudo leer el archivo","err");
  r.readAsText(file);
}

let filtro = {desde:null, hasta:null, customerId:"", productId:"", categoryId:"", method:"", pago:""};

function datosFiltrados(){
  const d = filtro.desde||rangoPeriodo("mes").desde, h = filtro.hasta||HOY();
  let ventas = ventasActivas().filter(v=>enRango(v.soldAt,d,h));
  if(filtro.customerId) ventas = ventas.filter(v=>v.customerId===filtro.customerId);
  if(filtro.productId)  ventas = ventas.filter(v=>v.items.some(i=>i.productId===filtro.productId));
  if(filtro.pago)       ventas = ventas.filter(v=>estadoPago(v)===filtro.pago);
  const ids = new Set(ventas.map(v=>v.id));
  let pagos = D.payments.filter(p=>p.status==="active" && enRango(p.paidAt,d,h) && ids.has(p.saleId));
  if(filtro.method) pagos = pagos.filter(p=>p.method===filtro.method);
  let gastos = D.expenses.filter(g=>g.status==="active" && enRango(g.date,d,h));
  if(filtro.categoryId) gastos = gastos.filter(g=>g.categoryId===filtro.categoryId);
  if(filtro.method)     gastos = gastos.filter(g=>g.paymentMethod===filtro.method);
  return {desde:d, hasta:h, ventas, pagos, gastos};
}

const fecha0 = f => f ? new Date(f+"T12:00:00") : null;
function hojasReporte(){
  const x = datosFiltrados();

  const resumen = [
    ["Reporte", D.settings.negocio], ["Desde", fecha0(x.desde)], ["Hasta", fecha0(x.hasta)],

  x.ventas.forEach(v=>ventas.push([v.folio, v.id, fecha0(v.soldAt), v.customerId||"", v.customerNameSnapshot,
    v.priceTier==="wholesale"?"mayoreo":"menudeo", deCent(v.subtotalCents), deCent(v.discountCents), deCent(v.taxCents),
    deCent(v.totalCents), deCent(v.costTotalCents), deCent(v.grossProfitCents),
    (v.subtotalCents-v.discountCents) ? v.grossProfitCents/(v.subtotalCents-v.discountCents) : 0,
    deCent(pagadoDe(v)), deCent(saldoDe(v)), ETIQ_PAGO[estadoPago(v)], EST_FACTURA[v.invoiceStatus]]));

  const detalle = [["VentaFolio","VentaID","Fecha","ProductoID","Producto","Cantidad","Unidad","PrecioUnitario","CostoUnitario","Subtotal","Costo","Utilidad","IVA"]];
  x.ventas.forEach(v=>v.items.forEach(i=>detalle.push([v.folio, v.id, fecha0(v.soldAt), i.productId||"", i.nameSnapshot,
    i.quantity, i.unit, deCent(i.unitPriceCents), deCent(i.unitCostCents), deCent(i.subtotalCents),
    deCent(i.costSubtotalCents), deCent(i.grossProfitCents), deCent(i.taxAmountCents)])));

  const cobros = [["PagoID","VentaFolio","VentaID","Fecha","Método","Monto","Referencia"]];
  x.pagos.forEach(p=>{ const v = D.sales.find(s=>s.id===p.saleId)||{};
    cobros.push([p.id, v.folio||"", p.saleId, fecha0(p.paidAt), METODOS[p.method]||p.method, deCent(p.amountCents), p.reference||""]); });

  const gastos = [["Folio","ID","Fecha","Concepto","Categoría","Proveedor","Método","Monto","Estado"]];
  x.gastos.forEach(g=>gastos.push([g.folio, g.id, fecha0(g.date), g.concept, nomCat(g.categoryId),
    g.supplier||"", METODOS[g.paymentMethod]||g.paymentMethod, deCent(g.amountCents), g.status]));

  const cxc = [["VentaFolio","VentaID","Cliente","Fecha","Total","Pagado","Saldo"]];
  cuentasPorCobrar().forEach(o=>cxc.push([o.venta.folio, o.venta.id, o.venta.customerNameSnapshot,
    fecha0(o.venta.soldAt), deCent(o.venta.totalCents), deCent(pagadoDe(o.venta)), deCent(o.saldo)]));

  const prods = [["ID","Nombre","Categoría","Tipo","Unidad","Costo","PrecioMenudeo","PrecioMayoreo","Utilidad","Margen","Existencia","Mínimo","Activo","CostoDesconocido"]];
  D.products.forEach(p=>prods.push([p.id, p.name, p.category, p.type, UNIDADES[p.saleUnit], deCent(p.unitCostCents),
    deCent(p.retailPriceCents), p.wholesalePriceCents==null?"":deCent(p.wholesalePriceCents),
    deCent(p.retailPriceCents-p.unitCostCents), p.retailPriceCents?(p.retailPriceCents-p.unitCostCents)/p.retailPriceCents:0,
    p.stock==null?"":p.stock, p.minStock==null?"":p.minStock, p.active?"sí":"no", p.costoDesconocido?"sí":"no"]));

  const clis = [["ID","Nombre","Teléfono","Dirección","Tarifa","RazónSocial","RFC","CPFiscal","Régimen","UsoCFDI","Correo"]];

    c.fiscalRegime, c.defaultCfdiUse, c.billingEmail]));

  return [["Resumen",resumen],["Ventas",ventas],["Detalle de ventas",detalle],["Cobros",cobros],
          ["Gastos",gastos],["Cuentas por cobrar",cxc],["Productos",prods],["Clientes",clis]];

function cargarSheetJS(){
  return new Promise((ok,mal)=>{
    if(self.XLSX) return ok(self.XLSX);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ()=> self.XLSX ? ok(self.XLSX) : mal(new Error("XLSX no disponible"));
    s.onerror = ()=>mal(new Error("no se pudo cargar"));
    document.head.appendChild(s);
    setTimeout(()=>{ if(!self.XLSX) mal(new Error("tiempo agotado")); }, 12000);
  });
}
async function exportarExcel(){
  aviso("Preparando el Excel…");
  try{
    const XLSX = await cargarSheetJS();
    const lb = XLSX.utils.book_new();
    hojasReporte().forEach(([n,aoa])=>{
      const hs = XLSX.utils.aoa_to_sheet(aoa, {cellDates:true});
      hs["!cols"] = (aoa[0]||[]).map(()=>({wch:16}));
      XLSX.utils.book_append_sheet(lb, hs, n.slice(0,31));
    });
    const buf = XLSX.write(lb, {bookType:"xlsx", type:"array", cellDates:true});
    bajarArchivo(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),
      `sierra-noble-${filtro.desde}-a-${filtro.hasta}.xlsx`);
    aviso("Excel generado","ok");
  }catch(e){
    console.error(e);
    aviso("No se pudo cargar Excel. Descargando CSV.","err");
    exportarCSV();
  }
}
function exportarCSV(){
  const q = v => v instanceof Date ? iso(v) : `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const txt = hojasReporte().map(([n,aoa])=>`## ${n}\n`+aoa.map(f=>f.map(q).join(",")).join("\n")).join("\n\n");
  if(bajarArchivo(new Blob(["\uFEFF"+txt],{type:"text/csv;charset=utf-8"}), `sierra-noble-${filtro.desde}-a-${filtro.hasta}.csv`))
    aviso("CSV descargado","ok");
}

/* ══════════════════════════════════════════════════════════
   MIGRACIÓN DE ESQUEMA Y ARRANQUE
   ══════════════════════════════════════════════════════════ */
function migrarEsquema(d){
  const base = baseVacia();
  d.settings = Object.assign(base.settings, d.settings||{});
  d.settings.folios = Object.assign({order:0,sale:0,expense:0}, d.settings.folios||{});
  d.settings.emisor = Object.assign({legalName:"",rfc:"",fiscalRegime:"",fiscalZipCode:""}, d.settings.emisor||{});
  ["products","customers","orders","sales","payments","expenses","expenseCategories","stockMoves"]
    .forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  if(!d.expenseCategories.length) d.expenseCategories = categoriasIniciales();
  d.products.forEach(p=>{
    if(p.stock===undefined) p.stock=null; if(p.minStock===undefined) p.minStock=null;
    const esQuesoBase=QUESOS.some(q=>normaliza(q.n)===normaliza(p.name));
    if(esQuesoBase && (!p.unitCostCents || p.costoDesconocido)){
      p.unitCostCents=costoCompraKgPorNombre(p.name); p.costoDesconocido=false; p.updatedAt=ahora();
    }
  });
  d.sales.forEach(v=>{
    if(!v.status) v.status="active";
    if(!v.invoiceStatus) v.invoiceStatus = v.invoiceRequested?"pending":"not_requested";
    v.items.forEach(i=>{ if(i.stockUnits===undefined) i.stockUnits = i.quantity; });
  });
  d.orders.forEach(o=>{
    o.items.forEach(i=>{ if(i.stockUnits===undefined) i.stockUnits=i.quantity; });
    if(o.stockAplicado===undefined) o.stockAplicado = false;
  });
  d.sales.forEach(v=>{ if(v.stockAplicado===undefined) v.stockAplicado = (v.status==="active"); });
  d.payments.forEach(p=>{ if(!p.status) p.status="active"; });
  ["products","customers","orders","sales","payments","expenses"].forEach(t=>
    (d[t]||[]).forEach(r=>{ if(!r.updatedAt) r.updatedAt = r.createdAt || ahora(); }));
  if(!d.sync) d.sync = {url:"", token:"", activo:false, ultimoPush:null, ultimoPull:null,
                        dispositivo:uid("disp"), ultimoError:"", ultimaVez:null, correo:""};
  d.expenses.forEach(g=>{ if(!g.status) g.status="active"; });
  d.schemaVersion = SCHEMA;
  return d;
}

async function arrancar(){
  await Disco.init();
  let doc = await Disco.leer(CLAVE);
  let avisos = [];
  if(doc){ D = migrarEsquema(doc); }
  else {
    D = baseVacia();
    D.expenseCategories = categoriasIniciales();
    D.products = catalogoInicial();
    await guardar();
  }
  $("negocio").textContent = D.settings.negocio;
  document.title = D.settings.negocio+" · Sierra Noble";
  $("a-clientes").onclick = abrirClientes;
  $("a-articulos").onclick= abrirProductos;
  pintarNav();
  irA("inicio");
  marcaGuardado("ok");
  ajustesSync();
  iniciarSupabase();
  const ses = await sesionActual();
  D.sync.activo = !!ses;
  if(ses && ses.user) D.sync.correo = ses.user.email || "";
  marcaSync("ok");
  if(sb){
    sb.auth.onAuthStateChange((ev, sesion)=>{
      D.sync.activo = !!sesion;
      D.sync.correo = (sesion && sesion.user) ? (sesion.user.email||"") : "";
      marcaSync("ok");
      if(sesion){ Sync.suscribir(); Sync.ciclo({silencioso:true}); }
    });
  }
  if(ses){ Sync.suscribir(); setTimeout(()=>Sync.ciclo({silencioso:true}), 800); }
  if(avisos.length) setTimeout(()=>aviso(avisos[0],"",7000), 900);
  if(Disco.modo()==="memoria") setTimeout(()=>aviso("Sin almacenamiento disponible: descarga un respaldo antes de cerrar.","err",9000), 1400);
}


/* ══════════════════════════════════════════════════════════
   SINCRONIZACIÓN
   La app es "primero local": todo se guarda en el teléfono y
   funciona sin señal. Cuando hay red, empuja lo cambiado y
   trae lo de los demás.

   Fuente de verdad compartida: Supabase (tabla "registros").
   La app usa la publishable key (segura de exponer, protegida
   por RLS) y una sesión de usuario. Realtime empuja cada cambio
   a los dos al instante. La service_role key NUNCA vive aquí.
   ══════════════════════════════════════════════════════════ */
const TABLAS = ["products","customers","orders","sales","payments","expenses"];

function ajustesSync(){
  if(!D.sync) D.sync = {url:"", token:"", activo:false, ultimoPush:null, ultimoPull:null,
                        dispositivo:"", ultimoError:"", ultimaVez:null, correo:""};
  if(!D.sync.dispositivo) D.sync.dispositivo = uid("disp");
  return D.sync;
}
/* marca de tiempo: sin ella un registro nunca viaja */
function tocar(o){ o.updatedAt = ahora(); return o; }

function cambiosDesde(marca){
  const out = {};
  TABLAS.forEach(t=>{
    out[t] = (D[t]||[]).filter(r=>!marca || !r.updatedAt || r.updatedAt > marca);
  });
  out.settings = D.settings;
  return out;
}
const cuentaCambios = c => TABLAS.reduce((s,t)=>s+(c[t]||[]).length, 0);

/* combina lo que viene del servidor: gana la marca de tiempo más nueva */
function fundir(remoto){
  let aplicados = 0, conflictos = 0;
  TABLAS.forEach(t=>{
    const entrantes = remoto[t] || [];
    if(!Array.isArray(D[t])) D[t] = [];
    const porId = new Map(D[t].map(r=>[r.id, r]));
    entrantes.forEach(nuevo=>{
      if(!nuevo || !nuevo.id) return;
      const mio = porId.get(nuevo.id);
      if(!mio){ D[t].push(nuevo); aplicados++; return; }
      const tMio = mio.updatedAt || mio.createdAt || "";
      const tSuyo = nuevo.updatedAt || nuevo.createdAt || "";
      if(tSuyo > tMio){
        Object.assign(mio, nuevo);
        aplicados++;
        if(tMio) conflictos++;
      }
    });
  });
  return {aplicados, conflictos};
}

const Sync = (()=>{
  let corriendo = false, pendiente = false, temporizador = null;

  async function pullSB(desde){
    let q = sb.from("registros").select("tabla,id,datos,updated_at")
      .eq("negocio", SB_NEGOCIO).order("updated_at",{ascending:true}).limit(5000);
    if(desde) q = q.gt("updated_at", desde);
    const { data, error } = await q;
    if(error) throw new Error(error.message||"lectura");
    const out = {}; let hasta = desde;
    (data||[]).forEach(row=>{
      if(!row.datos) return;
      (out[row.tabla] = out[row.tabla]||[]).push(row.datos);
      if(!hasta || row.updated_at > hasta) hasta = row.updated_at;
    });
    return { datos: out, hasta };
  }
  async function pushSB(cambios){
    const filas = [];
    TABLAS.forEach(t=>{
      (cambios[t]||[]).forEach(r=>{
        if(r && r.id) filas.push({ negocio:SB_NEGOCIO, tabla:t, id:r.id, datos:r });
      });
    });
    if(!filas.length) return 0;
    const { error } = await sb.from("registros").upsert(filas, { onConflict:"negocio,tabla,id" });
    if(error) throw new Error(error.message||"escritura");
    return filas.length;
  }

  async function ciclo({silencioso}={}){
    const s = ajustesSync();
    if(!sb || !s.activo) return {ok:false, motivo:"sin sesión"};
    if(corriendo){ pendiente = true; return {ok:false, motivo:"ocupado"}; }
    corriendo = true; marcaSync("trabajando");
    try{
      const bajada = await pullSB(s.ultimoPull);
      let res = {aplicados:0, conflictos:0};
      if(bajada && bajada.datos) res = fundir(bajada.datos);
      if(bajada && bajada.hasta) s.ultimoPull = bajada.hasta;

      const mios = cambiosDesde(s.ultimoPush);
      const n = await pushSB(mios);
      if(n > 0) s.ultimoPush = ahora();

      s.ultimoError = ""; s.ultimaVez = ahora();
      await Disco.escribir(CLAVE, D);
      marcaSync("ok");
      if(res.aplicados) refrescar();
      if(!silencioso){
        const partes = [];
        if(n) partes.push(`${n} enviado${n===1?"":"s"}`);
        if(res.aplicados) partes.push(`${res.aplicados} recibido${res.aplicados===1?"":"s"}`);
        aviso(partes.length ? "Sincronizado: "+partes.join(" · ") : "Todo al día","ok");
      }
      return {ok:true, enviados:n, recibidos:res.aplicados};
    }catch(e){
      s.ultimoError = e.message || "falló la conexión";
      marcaSync("mal");
      if(!silencioso) aviso("No se pudo sincronizar: "+s.ultimoError+". Tus datos siguen guardados en el teléfono.","err",6000);
      return {ok:false, motivo:s.ultimoError};
    }finally{
      corriendo = false;
      if(pendiente){ pendiente = false; setTimeout(()=>ciclo({silencioso:true}), 1500); }
    }
  }

  function suscribir(){
    if(!sb || canalRT) return;
    try{
      canalRT = sb.channel("registros-sn")
        .on("postgres_changes",
            { event:"*", schema:"public", table:"registros", filter:"negocio=eq."+SB_NEGOCIO },
            payload=>{
              const row = payload.new || payload.old;
              if(!row || !row.datos) return;
              const remoto = {}; remoto[row.tabla] = [row.datos];
              const res = fundir(remoto);
              if(res.aplicados){ Disco.escribir(CLAVE, D); refrescar(); marcaSync("ok"); }
            })
        .subscribe();
    }catch(e){ canalRT = null; }
  }
  function desuscribir(){ try{ if(canalRT){ sb.removeChannel(canalRT); canalRT = null; } }catch(e){} }

  return {
    ciclo, suscribir, desuscribir,
    /* se llama después de cada guardado; espera a que pare la mano */
    programar(){
      const s = ajustesSync();
      if(!sb || !s.activo) return;
      clearTimeout(temporizador);
      temporizador = setTimeout(()=>ciclo({silencioso:true}), 3000);
    },
    async entrar(correo, clave){
      if(!sb) throw new Error("Sin conexión con el servidor");
      const { data, error } = await sb.auth.signInWithPassword({ email:correo, password:clave });
      if(error) throw new Error(error.message||"no se pudo entrar");
      return data;
    },
    async salir(){
      desuscribir();
      if(sb){ try{ await sb.auth.signOut(); }catch(e){} }
      const s = ajustesSync(); s.activo = false; s.correo = "";
      await guardar(); marcaSync("ok");
    },
    hayCambios(){ return cuentaCambios(cambiosDesde(ajustesSync().ultimoPush)); }
  };
})();

/* indicador del encabezado */
function marcaSync(estado){
  const p = $("punto-s"), t = $("sync-txt");
  if(!p) return;
  const s = ajustesSync();
  if(!s.activo){ p.style.display="none"; t.style.display="none"; return; }
  p.style.display=""; t.style.display="";
  p.className = "punto"+(estado==="trabajando"?" trabajando":estado==="mal"?" mal":"");
  t.textContent = estado==="trabajando" ? "Sincronizando…"
    : estado==="mal" ? "Sin conexión" : "Al día";
}

      };

      if(ba) ba.onclick = async ()=>{ await Sync.ciclo(); pintar(); };
      const bs = $("sy-salir");
      if(bs) bs.onclick = async ()=>{ await Sync.salir(); pintar(); };

    pintar();

      if(yaInstalada()) pasos = `<div class="aviso" style="border-color:var(--verde);border-style:solid;color:var(--verde)">

      else if(promesaInstalar) pasos = `<p class="ayuda">Tu teléfono puede instalarla de un toque.</p>
        <button class="btn" id="ins-ya">Instalar ahora</button>`;
      else if(esIOS()) pasos = `<p class="ayuda">En iPhone se hace a mano, son tres pasos:</p>
        <div class="opciones">
          <div class="op col"><strong>1 · Toca Compartir</strong><span class="men">El cuadrito con la flecha hacia arriba, abajo en el navegador.</span></div>
          <div class="op col"><strong>2 · «Agregar a inicio»</strong><span class="men">Baja en la lista hasta encontrarlo.</span></div>
          <div class="op col"><strong>3 · Agregar</strong><span class="men">Queda el ícono como cualquier otra app.</span></div>
        </div>`;
      else pasos = `<p class="ayuda">En Android, desde Chrome:</p>
        <div class="opciones">
          <div class="op col"><strong>1 · Menú de tres puntos</strong><span class="men">Arriba a la derecha del navegador.</span></div>
          <div class="op col"><strong>2 · «Instalar aplicación»</strong><span class="men">O «Agregar a pantalla de inicio».</span></div>
        </div>`;
      f.cuerpo.innerHTML = `<h2 class="pregunta">Instalar en el teléfono</h2>${pasos}
        <div class="aviso oro" style="margin-top:18px"><b>Para qué sirve.</b> Queda el ícono en la pantalla de inicio, abre a pantalla completa sin barra del navegador, y funciona aunque no haya señal.</div>
        ${location.protocol!=="https:" && location.hostname!=="localhost"
          ? `<div class="aviso rojo" style="margin-top:12px">Esta página no está en https. Para poder instalarla hay que subirla a un hospedaje propio.</div>` : ""}`;
      const b = $("ins-ya");
      if(b) b.onclick = async ()=>{
        promesaInstalar.prompt();
        const r = await promesaInstalar.userChoice;
        promesaInstalar = null;
        aviso(r.outcome==="accepted" ? "Instalada" : "Puedes instalarla después", r.outcome==="accepted"?"ok":"");
        pintar();
      };
    };
    pintar();
    f.pie.innerHTML = `<button class="btn claro" id="ins-ok">Cerrar</button>`;
    $("ins-ok").onclick = cerrarHoja;
  }});
}
