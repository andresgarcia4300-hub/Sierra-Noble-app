<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sierra Noble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --tinta:#14161A; --tinta-80:#2A2E35; --tinta-70:#4A4F58; --tinta-40:#8B919B;
  --papel:#FAF8F3; --carta:#FFFFFF; --linea:#E4DFD4; --linea-f:#CFC7B6;
  --crema:#F2EDE1;
  --oro:#B8862B; --verde:#477A4A; --rojo:#B23A2C; --vacio:#2E4756;
  --r:16px; --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--papel);color:var(--tinta);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.4;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.nt{font-variant-numeric:tabular-nums}

/* ══ encabezado ══ */
.topbar{background:var(--carta);color:var(--tinta);padding:calc(16px + env(safe-area-inset-top)) 18px 16px;
  border-bottom:3px solid var(--oro);position:sticky;top:0;z-index:50}
.tb-fila{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:46px;height:46px;flex:none;border-radius:13px;display:block;object-fit:cover;background:#000}
.marca-t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:25px;line-height:1}
.marca-s{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--oro);font-weight:700;margin-top:2px}
.estado-g{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tinta-40);font-weight:600;flex:none}
.punto{width:9px;height:9px;border-radius:50%;background:var(--verde);flex:none}
.punto.trabajando{background:var(--oro)}
.punto.mal{background:var(--rojo)}
.atajos{display:flex;gap:9px;margin-top:14px}
.atajos button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--linea-f);background:var(--crema);
  color:var(--tinta);font-size:15px;font-weight:700}
.atajos button:active{background:var(--linea)}

/* ══ navegación ══ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:flex-end;
  background:var(--carta);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;font-weight:600;color:var(--tinta-40);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--tinta)}
.nav .fab{margin-top:-18px}
.nav .fab .cir{width:56px;height:56px;border-radius:18px;background:var(--tinta);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(20,22,26,.3)}
.nav .fab .cir svg{width:26px;height:26px}

/* ══ vistas ══ */
.vista{display:none;padding:18px 16px 0}
.vista.on{display:block}
.saludo{font-size:28px;font-weight:800;line-height:1.1}
.saludo-s{color:var(--tinta-70);font-size:15px;margin:3px 0 20px}
.rotulo{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--tinta-70);margin:0 0 12px;display:flex;align-items:center;gap:12px}
.titulo-v{font-size:27px;font-weight:800}
.sub-v{color:var(--tinta-70);font-size:15px;margin:3px 0 18px}

.bloque{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:18px;margin-bottom:12px}
.bloque h3{font-size:19px;font-weight:800;margin-bottom:14px}
.bloque-t{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--tinta-70);margin:0 0 12px}
.oscuro{background:var(--crema);border-color:var(--linea-f);color:var(--tinta);border-left:5px solid var(--oro)}
.oscuro .bloque-t{color:#8a6620}
.oscuro .cifra{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.reng{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.reng:last-child{border-bottom:0}
.reng .n{flex:1;font-size:17px;font-weight:500}
.reng .c{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:23px;font-variant-numeric:tabular-nums}
.reng .u{color:var(--tinta-40);font-size:14px}

/* ══ tablero ══ */
.periodo{display:flex;gap:7px;margin-bottom:14px}
.periodo button{flex:1;padding:10px 6px;border-radius:999px;border:1px solid var(--linea);background:var(--carta);
  font-size:14px;font-weight:600;color:var(--tinta-70)}
.periodo button[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.tablero{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.tarj{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:16px;text-align:left;display:block;width:100%;position:relative}
.tarj h4{font-size:14px;font-weight:600;color:var(--tinta-70);margin:0 0 8px;font-family:"Public Sans",sans-serif}
.tarj .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:27px;line-height:1;font-variant-numeric:tabular-nums}
.tarj .p{font-size:13px;color:var(--tinta-40);margin-top:6px}
.tarj .ir{font-size:13px;color:var(--oro);font-weight:700;margin-top:10px}
.tarj.rojo .v{color:var(--rojo)}
.tarj.grande{grid-column:1/-1;grid-row:span 2;background:var(--crema);border-color:var(--linea-f);border-left:5px solid var(--oro);
  display:flex;flex-direction:column;justify-content:flex-end;min-height:180px}
.tarj.grande h4{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#8a6620;margin-bottom:10px}
.tarj.grande .v{font-size:42px}
.tarj.grande .p{color:var(--verde);font-weight:600;font-size:15px;margin-top:8px}
@media (min-width:640px){
  .tablero{grid-template-columns:repeat(4,1fr)}
  .tarj.grande{grid-column:span 2;grid-row:span 2}
  main{max-width:900px;margin:0 auto}
}

/* ══ gráfica ══ */
.graf-cab{display:flex;align-items:center;margin-bottom:14px}
.graf-cab h3{flex:1}
.leyenda{display:flex;gap:14px;font-size:12px;color:var(--tinta-70);font-weight:600}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.graf{width:100%;height:150px;display:block}

/* ══ filas ══ */
.fila{position:relative;display:block;width:100%;text-align:left;background:var(--carta);
  border:1px solid var(--linea);border-radius:var(--r);padding:14px 16px;margin-bottom:9px;overflow:hidden}
.fila.borde{padding-left:20px}
.fila.borde::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--oro)}
.fila.vac::before{background:var(--vacio)}
.fila.deb::before{background:var(--rojo)}
.fila.can{opacity:.5}
.fila.can::before{background:var(--tinta-40)}
.f-top{display:flex;align-items:center;gap:10px}
.f-nom{font-weight:700;font-size:17px;flex:1;letter-spacing:-.01em}
.f-det{color:var(--tinta-70);font-size:14px;margin-top:3px}
.f-pie{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
.f-tot{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;margin-left:auto;font-variant-numeric:tabular-nums}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--papel);color:var(--oro);flex:none;
  display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px}
.flecha{color:var(--tinta-40);font-size:20px;flex:none}
.etq{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--tinta-40);
  border:1px solid var(--linea);border-radius:5px;padding:3px 7px}
.etq.rojo{color:#fff;background:var(--rojo);border-color:var(--rojo)}
.etq.verde{color:#fff;background:var(--verde);border-color:var(--verde)}
.etq.oro{color:#fff;background:var(--oro);border-color:var(--oro)}
.etq.gris{color:#fff;background:var(--tinta-40);border-color:var(--tinta-40)}
.etq.suave{background:var(--papel);color:var(--verde);border-color:transparent}
.etq.grande{font-size:11px;padding:6px 11px;border-radius:7px}
.sello{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;border:2px solid var(--oro);color:var(--oro);padding:3px 7px;border-radius:5px;transform:rotate(-3deg)}
.sello.v{border-color:var(--vacio);color:var(--vacio)}
.vacio-m{text-align:center;color:var(--tinta-40);padding:36px 20px;font-size:15px}
.vacio-m b{display:block;font-size:18px;color:var(--tinta-70);margin-bottom:6px;font-family:"Bricolage Grotesque",sans-serif}
.grupo{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--tinta-70);
  margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.grupo::after{content:"";flex:1;height:1px;background:var(--linea)}
.grupo.tarde{color:var(--rojo)}

/* ══ botones ══ */
.btn{width:100%;min-height:var(--tap);border-radius:var(--r);background:var(--tinta);color:#fff;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;padding:0 16px}
.btn:disabled{background:var(--tinta-40)}
.btn.claro{background:var(--carta);color:var(--tinta);border:1px solid var(--linea)}
.btn.oro{background:var(--oro)}
.btn.chico{min-height:46px;font-size:15px}
.btn.destacado{min-height:76px;font-size:23px;margin-bottom:16px;box-shadow:0 8px 22px rgba(20,22,26,.22)}
.acciones{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.par{display:flex;gap:8px}
.par button{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--linea);background:var(--papel);
  font-size:15px;font-weight:600;color:var(--tinta-70);padding:0 8px}
.par button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.par.wrap{flex-wrap:wrap}
.par.wrap button{flex:1 1 44%}
.rejilla2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ══ formularios ══ */
.campo{margin-bottom:15px}
.campo label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--tinta-70);margin-bottom:7px}
.campo .pista{font-size:13px;color:var(--tinta-40);margin:7px 0 0}
.txt{width:100%;min-height:52px;padding:14px;border:1px solid var(--linea);border-radius:12px;background:#fff}
textarea.txt{min-height:66px}
select.txt{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6' fill='none' stroke='%234A4F58' stroke-width='2'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;background-size:20px;padding-right:44px}
.num{width:100%;height:56px;padding:0 14px;text-align:left;border:1px solid var(--linea);border-radius:12px;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;background:#fff}
.num.centro{text-align:center}
.con-uni{position:relative}
.con-uni .num{padding-right:52px}
.con-uni .uni{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-40);pointer-events:none}
.aviso{border:1px dashed var(--linea);border-radius:12px;padding:13px 15px;font-size:14px;color:var(--tinta-70);background:var(--carta)}
.aviso.rojo{border-color:var(--rojo);border-style:solid;color:var(--rojo)}
.aviso.oro{border-color:var(--oro);border-style:solid;color:#7a5a1c}
.check-lin{display:flex;align-items:center;gap:10px;margin-bottom:15px;font-size:15px}
.check-lin input{width:22px;height:22px;flex:none}

/* ══ hojas ══ */
.hoja{position:fixed;inset:0;z-index:70;background:var(--papel);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.hoja.abierta{transform:translateY(0);visibility:visible}
.hoja-top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  border-bottom:1px solid var(--linea);background:var(--carta)}
.hoja-top h2{font-size:17px;font-weight:800;flex:1;text-align:center}
.volver{font-size:16px;font-weight:700;color:var(--tinta-70);padding:6px 2px;min-width:76px;text-align:left}
.pasos{display:flex;gap:4px;min-width:76px;justify-content:flex-end}
.pt{width:18px;height:4px;border-radius:2px;background:var(--linea)}
.pt.on{background:var(--oro)}
.hoja-cuerpo{flex:1;overflow-y:auto;padding:22px 16px 24px;-webkit-overflow-scrolling:touch}
.hoja-pie{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--linea);background:var(--carta)}
.pregunta{font-size:27px;font-weight:800;line-height:1.14;margin:0 0 5px}
.ayuda{color:var(--tinta-70);font-size:15px;margin:0 0 18px}
@media (min-width:640px){ .hoja-cuerpo>*, .hoja-pie>*{max-width:900px;margin-left:auto;margin-right:auto} }

.opciones{display:flex;flex-direction:column;gap:9px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:var(--tap);padding:14px 16px;
  border-radius:12px;background:var(--carta);border:1px solid var(--linea);font-weight:600;font-size:16px}
.op[aria-pressed="true"]{border-color:var(--tinta);border-width:2px;padding:13px 15px}
.op .chk{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--tinta);color:#fff;
  display:none;align-items:center;justify-content:center;font-size:14px;flex:none}
.op[aria-pressed="true"] .chk{display:flex}
.op.col{flex-direction:column;align-items:flex-start;gap:4px}
.op.col .men{font-size:13px;font-weight:400;color:var(--tinta-40)}
.op.col strong{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:800}

/* ══ importar contactos ══ */
.import{background:var(--crema);border:1px solid var(--linea-f);border-left:5px solid var(--oro);border-radius:var(--r);
  padding:15px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.import div{flex:1}
.import strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:800}
.import span{font-size:13px;color:var(--tinta-70);display:block;margin-top:3px}
.import button{background:var(--oro);color:#fff;font-weight:800;padding:0 18px;height:48px;border-radius:11px;flex:none;font-size:15px}
.import button:disabled{background:var(--linea);color:var(--tinta-40)}

/* ══ selector de productos ══ */
.buscador{width:100%;min-height:50px;padding:13px 15px;border:1px solid var(--linea);border-radius:12px;background:#fff;margin-bottom:11px}
.cintas{display:flex;gap:7px;overflow-x:auto;padding-bottom:11px;-webkit-overflow-scrolling:touch}
.cintas button{flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--linea);background:var(--carta);
  font-size:14px;font-weight:600;color:var(--tinta-70);white-space:nowrap}
.cintas button[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.prod{background:var(--carta);border:1px solid var(--linea);border-radius:12px;margin-bottom:8px;overflow:hidden}
.prod.on{border-color:var(--tinta);border-width:2px}
.prod-cab{display:flex;align-items:center;gap:11px;width:100%;min-height:var(--tap);padding:12px 15px;text-align:left}
.prod-cab .nm{flex:1;font-weight:600;font-size:16px}
.prod-cab .pz{font-size:13px;color:var(--tinta-40);font-weight:600;text-align:right}
.prod-cab .pz small{display:block;font-size:11px}
.punto-c{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.18)}
.mas{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--linea);display:flex;align-items:center;
  justify-content:center;color:var(--tinta-40);font-size:19px;line-height:1;flex:none}
.prod.on .mas{background:var(--tinta);border-color:var(--tinta);color:#fff}
.cuerpo-p{display:none;flex-direction:column;gap:11px;padding:0 15px 15px}
.prod.on .cuerpo-p{display:flex}
.modos{display:flex;border:1px solid var(--linea);border-radius:11px;overflow:hidden}
.modos button{flex:1;height:42px;font-size:14px;font-weight:600;color:var(--tinta-40)}
.modos button[aria-pressed="true"]{background:var(--tinta);color:#fff}
.medidas{display:flex;gap:6px;flex-wrap:wrap}
.medidas button{flex:1 1 0;min-width:62px;height:44px;border-radius:10px;border:1px solid var(--linea);
  background:var(--papel);font-size:14px;font-weight:600;color:var(--tinta-70)}
.medidas button[aria-pressed="true"]{background:var(--oro);border-color:var(--oro);color:#fff}
.medidas.porc button{height:54px;line-height:1.15}
.medidas.porc button b{display:block;font-size:16px}
.medidas.porc button i{display:block;font-style:normal;font-size:12px;opacity:.75}
.cont{display:flex;align-items:center;gap:7px}
.paso{width:50px;height:54px;border-radius:11px;background:var(--papel);border:1px solid var(--linea);
  font-size:24px;font-weight:600;line-height:1;flex:none}
.cont .num{height:54px;text-align:center;border-width:2px;border-color:var(--tinta);padding:0}
.uni-l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--tinta-40);flex:none}
.equiv{display:flex;align-items:baseline;gap:8px;padding-top:9px;border-top:1px dashed var(--linea)}
.equiv em{flex:1;font-style:normal;font-size:13px;color:var(--tinta-40)}
.equiv b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

/* ══ resumen ══ */
.res{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:18px;margin-bottom:12px}
.res-nom{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em}
.res-sub{color:var(--tinta-70);margin-top:3px;font-size:15px}
.res-lista{margin:15px 0 0;padding:0;list-style:none;border-top:1px solid var(--linea)}
.res-lista li{display:flex;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--linea)}
.res-lista li .nm{flex:1}
.res-lista li .dt{display:block;font-size:13px;color:var(--tinta-40)}
.res-lista li b{font-variant-numeric:tabular-nums;font-weight:700}
.lin{display:flex;align-items:baseline;gap:10px;margin-top:9px;padding-top:9px}
.lin span{flex:1;font-size:14px;color:var(--tinta-70);font-weight:600}
.lin b{font-variant-numeric:tabular-nums;font-weight:700}
.lin.total{border-top:2px solid var(--tinta);margin-top:13px;padding-top:13px}
.lin.total span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.lin.total b{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:800}
.margen{display:flex;gap:12px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--linea);font-size:14px;color:var(--tinta-70);flex-wrap:wrap}
.margen b{color:var(--verde);font-weight:700}
.barra-t{display:flex;align-items:baseline;gap:10px;padding:0 2px 10px}
.barra-t span{flex:1;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--tinta-70)}
.barra-t b{font-family:"Bricolage Grotesque",sans-serif;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}

/* ══ avisos ══ */

function imagenABase64Comprimida(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      /* La letra manuscrita y las fracciones pequeñas necesitan más detalle
         que una foto común. 2200 px conserva los trazos sin mandar el archivo
         original completo a la función. */
      const MAX = 2200;
      let w = img.width, h = img.height;
      if(w > MAX || h > MAX){ const esc = MAX/Math.max(w,h); w = Math.round(w*esc); h = Math.round(h*esc); }
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const dataUrl = cv.toDataURL("image/jpeg", 0.9);
      resolve({base64: dataUrl.split(",")[1], mediaType:"image/jpeg"});
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("no se pudo leer la imagen")); };
    img.src = url;
  });
}

function base64ABlob(base64, mediaType){
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mediaType});
}
function blobABase64(blob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result).split(",")[1]);
    r.onerror = ()=>reject(new Error("no se pudo leer la imagen"));
    r.readAsDataURL(blob);
  });
}

/* búsqueda difusa contra tu catálogo real; nunca inventa un producto que no exista */
function emparejarProducto(desc){
  if(!desc) return null;
  const sinAcentos = s => normaliza(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const n = sinAcentos(desc);
  let mejor = null, mejorPuntaje = 0;
  D.products.forEach(p=>{
    const np = sinAcentos(p.name);
    let puntaje = 0;
    if(np === n) puntaje = 3;
    else if(np.includes(n) || n.includes(np)) puntaje = 2;
    else if(n.split(" ").some(t=>t.length>2 && np.split(" ").includes(t))) puntaje = 1;
    if(puntaje > mejorPuntaje){ mejorPuntaje = puntaje; mejor = p; }
  });
  return mejorPuntaje > 0 ? mejor : null;
}
function capParaProducto(prod, cantidad){
  if(prod.porciones) return null;             // demasiado ambiguo para auto-mapear
  if(esPorPeso(prod)) return {modo:"peso", gramos: Math.round((Number(cantidad)||0)*1000)};
  return {modo:"unidad", cantidad: Number(cantidad)||0};
}

/* distancia de edición (Levenshtein) para dar un % de coincidencia real,
   no solo "se parece / no se parece" */
function distanciaEdicion(a, b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const fila = new Array(n+1);
  for(let j=0;j<=n;j++) fila[j]=j;
  for(let i=1;i<=m;i++){
    let anterior = fila[0]; fila[0]=i;
    for(let j=1;j<=n;j++){
      const temp = fila[j];
      fila[j] = a[i-1]===b[j-1] ? anterior : 1+Math.min(anterior, fila[j], fila[j-1]);
      anterior = temp;
    }
  }
  return fila[n];
}
function porcentajeSimilitud(a, b){
  const sinAcentos = s => normaliza(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const x = sinAcentos(a||""), y = sinAcentos(b||"");
  if(!x || !y) return 0;
  if(x === y) return 100;
  const corto = x.length <= y.length ? x : y;
  const largo = x.length <= y.length ? y : x;
  if(corto.length >= 3 && largo.includes(corto)){
    // ej. nota dice "Rogelio", cliente guardado es "Rogelio Martínez" — es
    // el mismo nombre, solo incompleto, no un nombre distinto que casualmente
    // se parece; la distancia de edición pura castigaría esto de más.
    const cobertura = corto.length / largo.length;
    return Math.round(60 + cobertura*40);
  }
  const dist = distanciaEdicion(x, y);
  const maxLen = Math.max(x.length, y.length);
  return maxLen ? Math.round((1 - dist/maxLen) * 100) : 0;
}

/* búsqueda difusa contra tus clientes guardados. SIEMPRE regresa nada más una
   sugerencia con porcentaje — nunca asigna el cliente por su cuenta, eso
   siempre lo confirma la persona tocando la sugerencia. */
function emparejarCliente(datos){
  const nombre = datos && datos.clienteTexto;
  const telefono = datos && datos.clienteTelefono ? String(datos.clienteTelefono).replace(/\D/g,"") : "";
  if(!nombre && !telefono) return null;
  let mejor = null, mejorPct = 0;
  D.customers.forEach(c=>{
    let pct = 0;
    if(telefono && c.phone && String(c.phone).replace(/\D/g,"") === telefono) pct = 100;
    else if(nombre) pct = porcentajeSimilitud(nombre, c.displayName||"");
    if(pct > mejorPct){ mejorPct = pct; mejor = c; }
  });
  return (mejor && mejorPct >= 40) ? {cliente:mejor, porcentaje:mejorPct} : null;
}

  if(datos.tipo === "venta") return prellenarPedidoDesdeScan(datos, foto);
  return elegirTipoManual(datos, foto);
}

function costoKgPesos(centsKg){ return deCent(centsKg||0); }
function centsKgDesdePesos(pesosKg){ return Math.max(0, aCent(pesosKg)); }

/* Una compra escaneada no se convierte en un texto plano. Cada renglón se
   revisa, se asocia al catálogo y calcula su importe. Esto también resuelve
   notas sin total: cantidad en kg × costo por kg. */
function prellenarGastoDesdeScan(datos, foto){
  const productos = D.products.filter(p=>p.active);
  const lineas = (datos.items||[]).map((i,ix)=>{
    const prod = emparejarProducto(i.articuloSugerido || i.descripcionTexto);
    const cantidadKg = Math.max(0, Number(i.cantidad)||0);
    const costoKgCents = prod ? (prod.unitCostCents||0) : 0;
    const importeLeidoCents = i.importe==null ? null : aCent(i.importe);
    return {id:uid("sci"), productId:prod?prod.id:"", descripcionTexto:i.descripcionTexto||"",
      cantidadTexto:i.cantidadTexto==null?"":String(i.cantidadTexto), cantidadKg,
      costoKgCents, importeCents:importeLeidoCents!=null?importeLeidoCents:Math.round(cantidadKg*costoKgCents),
      importeLeidoCents, confianza:i.confianza, revisar:!!i.revisar, orden:ix};
  });
  abrirRevisionCompraScan(datos, foto, productos, lineas);
}

        l.importeCents=Math.max(0,aCent(el.querySelector(".sc-importe").value));
      });
    };

    };

      box.innerHTML=`<div class="lin total"><span>Total calculado</span><b>${pesos(calculado)}</b></div>
        ${nota==null?`<div class="aviso oro" style="margin-top:12px"><b>La nota no trae total.</b> Centinela calculó el monto con los kilos y costos por kilo.</div>`:
        `<div class="lin"><span>Total escrito en la nota</span><b>${pesos(nota)}</b></div>${Math.abs(dif)>100?`<div class="aviso rojo" style="margin-top:12px">Hay una diferencia de <b>${pesos(Math.abs(dif))}</b>. Corrige los renglones antes de continuar.</div>`:`<div class="aviso" style="margin-top:12px;color:var(--verde);border-color:var(--verde)">Los totales coinciden.</div>`}`}`;
    };
    f.cuerpo.innerHTML=`<h2 class="pregunta">Artículo por artículo</h2>
      <p class="ayuda">Confirma el producto, los kilos y tu costo por kilo. El importe se calcula automáticamente.</p>
      ${foto?`<img src="data:${foto.mediaType};base64,${foto.base64}" alt="Nota escaneada" style="width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin-bottom:14px;background:#00000008">`:""}
      ${(datos.advertencias||[]).length?`<div class="aviso rojo" style="margin-bottom:14px">${datos.advertencias.map(esc).join("<br>")}</div>`:""}
      ${lineas.length?lineas.map((l,ix)=>`<section class="bloque" data-scan-linea="${l.id}">

function prellenarPedidoDesdeScan(datos, foto){
  const matches = [], sinMatch = [];
  (datos.items||[]).forEach(i=>{
    const prod = emparejarProducto(i.articuloSugerido || i.descripcionTexto);
    const cap = prod ? capParaProducto(prod, i.cantidad) : null;
    if(prod && cap) matches.push({productId:prod.id, cap});
    else sinMatch.push(i);
  });
  const clienteSugerido = emparejarCliente(datos);
  const notaExtra = [];
  if(sinMatch.length) notaExtra.push("Agregar a mano (no coincidió con el catálogo): "+sinMatch.map(textoItemScan).join("; "));
  if(datos.estadoPago) notaExtra.push("Nota decía: "+(datos.estadoPago==="pagado"?"Pagado":"Pendiente"));
  abrirCapturaPedido(null, {
    nombre: datos.clienteTexto || "",
    clienteSugerido,
    deliveryDate: datos.fecha || HOY(),
    matches,
    note: [datos.notas, ...notaExtra].filter(Boolean).join(" · "),
    foto, avisoRevision: datos.requiereRevision ? (datos.advertencias||[]) : null
  });
}

/* ── fechas locales YYYY-MM-DD ── */
const iso = d => { const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const HOY = () => iso(new Date());
const MANANA = () => { const d=new Date(); d.setDate(d.getDate()+1); return iso(d); };
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

}

/* ══════════════════════════════════════════════════════════
   PERSISTENCIA · window.storage → IndexedDB → memoria
   ══════════════════════════════════════════════════════════ */
const Disco = (()=>{
  let modo="memoria", idb=null;
  const mem={};
  function abrirIDB(){
    return new Promise((ok,mal)=>{
      if(!self.indexedDB) return mal(new Error("sin indexedDB"));
      const r = self.indexedDB.open("sierra-noble",1);
      r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
      r.onsuccess = ()=>ok(r.result);
      r.onerror = ()=>mal(r.error||new Error("idb"));
      setTimeout(()=>mal(new Error("idb lento")), 4000);
    });
  }
  const tx = (m,fn)=>new Promise((ok,mal)=>{
    const t = idb.transaction("kv",m), s = t.objectStore("kv"), r = fn(s);
    r.onsuccess = ()=>ok(r.result); r.onerror = ()=>mal(r.error);
  });
  return {
    modo: ()=>modo,
    etiqueta: ()=>({storage:"almacenamiento de la app", indexeddb:"este navegador", memoria:"solo memoria"}[modo]),
    async init(){
      if(self.window && window.storage && typeof window.storage.get==="function"){ modo="storage"; return modo; }
      try{ idb = await abrirIDB(); modo="indexeddb"; }catch(e){ modo="memoria"; }
      return modo;
    },
    async leer(clave){
      try{
        if(modo==="storage"){ const r = await window.storage.get(clave); return r&&r.value ? JSON.parse(r.value) : null; }
        if(modo==="indexeddb"){ const v = await tx("readonly",s=>s.get(clave)); return v ? JSON.parse(v) : null; }
        return mem[clave] ? JSON.parse(mem[clave]) : null;
      }catch(e){ return null; }
    },
    async escribir(clave, valor){
      const s = JSON.stringify(valor);
      if(modo==="storage") await window.storage.set(clave, s);
      else if(modo==="indexeddb") await tx("readwrite",st=>st.put(s,clave));
      else mem[clave]=s;
      return true;
    }
  };
})();

/* ══════════════════════════════════════════════════════════
   RENGLONES · snapshots históricos inmutables
   ══════════════════════════════════════════════════════════ */
function armarRenglon(o){
  const quantity = Math.max(0, Number(o.quantity)||0);
  const unitPriceCents = Math.max(0, Math.round(Number(o.unitPriceCents)||0));
  const unitCostCents  = Math.max(0, Math.round(Number(o.unitCostCents)||0));
  const taxRate = Math.max(0, Number(o.taxRate)||0);
  const subtotalCents     = Math.round(quantity*unitPriceCents);
  const costSubtotalCents = Math.round(quantity*unitCostCents);
  return {
    productId:o.productId||(o.product?o.product.id:null),
    nameSnapshot:o.nameSnapshot||(o.product?o.product.name:"Artículo"),
    quantity, unit:o.unit||"pieza",
    unitPriceCents, unitCostCents, subtotalCents, costSubtotalCents,
    grossProfitCents: subtotalCents-costSubtotalCents,
    taxRate, taxAmountCents: Math.round(subtotalCents*taxRate),
    gramos:o.gramos??null, piezas:o.piezas??null, tamano:o.tamano??null,
    stockUnits: o.stockUnits!=null ? o.stockUnits : quantity,
    costoDesconocido: !!o.costoDesconocido
  };
}
const sumaRenglones = items => items.reduce((a,i)=>({
  subtotal:a.subtotal+i.subtotalCents, costo:a.costo+i.costSubtotalCents,
  utilidad:a.utilidad+i.grossProfitCents, tax:a.tax+i.taxAmountCents
}), {subtotal:0,costo:0,utilidad:0,tax:0});

const esPorPeso = p => p.saleUnit==="kg" && p.allowsFraction;
function precioDe(prod, tier, tamano){
  if(prod.porciones && tamano){
    const p = prod.porciones.find(x=>x.gramos===tamano) || prod.porciones[0];
    return tier==="wholesale" && p.wholesalePriceCents!=null ? p.wholesalePriceCents : p.retailPriceCents;
  }
  return tier==="wholesale" && prod.wholesalePriceCents!=null ? prod.wholesalePriceCents : prod.retailPriceCents;
}

/* cap = {modo:'piezas'|'peso'|'porcion'|'unidad', gramos, piezas, tamano, cantidad} */
function renglonDeProducto(prod, tier, cap){
  if(prod.porciones && cap.modo==="porcion"){
    const n = Math.max(1, Math.round(cap.piezas||1));
    const tam = cap.tamano || prod.porciones[0].gramos;
    const gramos = n*tam;
    return armarRenglon({product:prod, nameSnapshot:prod.name, quantity:n, unit:"porción",
      unitPriceCents:precioDe(prod,tier,tam), unitCostCents:Math.round((prod.unitCostCents||0)*tam/1000),
      taxRate:prod.taxRate||0, gramos, piezas:n, tamano:tam,
      stockUnits: gramos/1000, costoDesconocido:!!prod.costoDesconocido});
  }
  if(esPorPeso(prod)){
    const gramos = cap.modo==="piezas" ? Math.max(1,Math.round(cap.piezas||1))*(cap.tamano||500) : Math.max(0,cap.gramos||0);
    return armarRenglon({product:prod, nameSnapshot:prod.name, quantity:gramos/1000, unit:"kg",
      unitPriceCents:precioDe(prod,tier), unitCostCents:prod.unitCostCents||0, taxRate:prod.taxRate||0,
      gramos, piezas: cap.modo==="piezas"?Math.max(1,Math.round(cap.piezas||1)):null,
      tamano: cap.modo==="piezas"?(cap.tamano||500):null,
      stockUnits: gramos/1000, costoDesconocido:!!prod.costoDesconocido});
  }
  const c = Math.max(0, Number(cap.cantidad)||0);
  return armarRenglon({product:prod, nameSnapshot:prod.name, quantity:c, unit:UNIDADES[prod.saleUnit]||"pieza",
    unitPriceCents:precioDe(prod,tier), unitCostCents:prod.unitCostCents||0, taxRate:prod.taxRate||0,
    stockUnits:c, costoDesconocido:!!prod.costoDesconocido});
}

function textoRenglon(i){
  if(i.unit==="porción") return `${i.piezas} × ${medida(i.tamano)} ${i.nameSnapshot}`;
  if(i.unit==="kg" && i.piezas) return `${i.piezas} pza${i.piezas>1?"s":""} de ${medida(i.tamano)} ${i.nameSnapshot}`;
  if(i.unit==="kg") return `${peso(i.gramos!=null?i.gramos:i.quantity*1000)} ${i.nameSnapshot}`;
  return `${numBonito(i.quantity)} ${i.unit}${i.quantity>1?"s":""} ${i.nameSnapshot}`;
}
function detalleRenglon(i){
  if(i.unit==="porción") return `${i.piezas} × ${medida(i.tamano)} · ${pesos(i.unitPriceCents)} c/u`;
  if(i.unit==="kg" && i.piezas) return `${i.piezas} × ${medida(i.tamano)} · ${peso(i.gramos)} · ${pesos(i.unitPriceCents)}/kg`;
  if(i.unit==="kg") return `${peso(i.gramos!=null?i.gramos:i.quantity*1000)} · ${pesos(i.unitPriceCents)}/kg`;
  return `${numBonito(i.quantity)} × ${pesos(i.unitPriceCents)}`;
}

/* ══════════════════════════════════════════════════════════
   INVENTARIO REAL
   ══════════════════════════════════════════════════════════ */
function moverStock(base, productId, delta, motivo, ref){
  const p = base.products.find(x=>x.id===productId);
  if(!p || p.stock==null || !delta) return;
  const antes = Number(p.stock)||0;
  p.stock = Math.round((antes + delta)*1000)/1000;
  p.updatedAt = ahora();
  base.stockMoves.push({id:uid("mov"), productId, delta, antes, despues:p.stock,
    motivo, ref:ref||"", at:ahora(), date:HOY()});
}
/* El inventario se aplica UNA sola vez por operación (pedido o venta).
   `stockAplicado` evita restar doble cuando un pedido se vuelve venta. */
function aplicarStock(base, op, motivo){
  if(op.stockAplicado) return false;
  op.items.forEach(i=>moverStock(base, i.productId, -(i.stockUnits||0), motivo, op.folio));
  op.stockAplicado = true;
  return true;
}
function revertirStock(base, op, motivo){
  if(!op.stockAplicado) return false;
  op.items.forEach(i=>moverStock(base, i.productId, (i.stockUnits||0), motivo||"cancelación", op.folio));
  op.stockAplicado = false;
  return true;
}
/* Reajusta el inventario cuando cambian los renglones de una operación ya aplicada */
function reajustarStock(base, op, itemsNuevos, motivo){
  if(!op.stockAplicado){ op.items = itemsNuevos; return; }
  const antes = {}, despues = {};
  op.items.forEach(i=>{ antes[i.productId] = (antes[i.productId]||0) + (i.stockUnits||0); });
  itemsNuevos.forEach(i=>{ despues[i.productId] = (despues[i.productId]||0) + (i.stockUnits||0); });
  new Set([...Object.keys(antes), ...Object.keys(despues)]).forEach(pid=>{
    const dif = (antes[pid]||0) - (despues[pid]||0);
    if(dif) moverStock(base, pid, dif, motivo||"ajuste de pedido", op.folio);
  });
  op.items = itemsNuevos;
}
const descontarVenta = (base,v) => aplicarStock(base, v, "venta");
const devolverVenta  = (base,v) => revertirStock(base, v, "cancelación");
const bajoMinimo = p => p.stock!=null && p.minStock!=null && Number(p.stock)<=Number(p.minStock);
const productosPorSurtir = () => D.products.filter(p=>p.active && bajoMinimo(p));

   VENTAS · PAGOS · SALDOS
   ══════════════════════════════════════════════════════════ */
function ventaDesde(base, ped, opt={}){
  const t = sumaRenglones(ped.items);
  const desc = Math.max(0, Math.min(opt.discountCents||0, t.subtotal));
  const cli = (base.customers||[]).find(c=>c.id===ped.customerId) || null;
  return {
    id:uid("vta"), folio:folioEn(base,"sale","VTA"), sourceOrderId:ped.id||null,
    soldAt: opt.soldAt||HOY(), customerId: ped.customerId||null,
    customerNameSnapshot: ped.customerNameSnapshot||"Mostrador", priceTier: ped.priceTier||"retail",
    items: clon(ped.items),
    subtotalCents:t.subtotal, discountCents:desc, taxCents:t.tax,
    totalCents: t.subtotal-desc+t.tax, costTotalCents:t.costo,
    grossProfitCents: t.subtotal-desc-t.costo,
    invoiceRequested: !!opt.invoiceRequested,
    invoiceStatus: opt.invoiceRequested ? "pending" : "not_requested",
    fiscalCustomerSnapshot: opt.invoiceRequested && cli ? {
      legalName:cli.legalName, rfc:cli.rfc, fiscalZipCode:cli.fiscalZipCode,
      fiscalRegime:cli.fiscalRegime, defaultCfdiUse:cli.defaultCfdiUse, billingEmail:cli.billingEmail} : null,
    uuid:"", xmlUrl:"", pdfUrl:"", status:"active", cancellationReason:"", stockAplicado:false, createdAt:ahora(), updatedAt:ahora()
  };
}
const ventasActivas = () => D.sales.filter(v=>v.status==="active");
const pagosDe = id => D.payments.filter(p=>p.saleId===id && p.status==="active");
const pagadoDe = v => pagosDe(v.id).reduce((s,p)=>s+p.amountCents,0);
const saldoDe = v => Math.max(0, v.totalCents - pagadoDe(v));
function estadoPago(v){
  const p = pagadoDe(v);
  return p<=0 ? "unpaid" : (p>=v.totalCents ? "paid" : "partial");
}
const ventaDePedido = ped => ped.saleId ? D.sales.find(v=>v.id===ped.saleId) : null;
const estadoPagoPedido = ped => { const v = ventaDePedido(ped); return v ? estadoPago(v) : "unpaid"; };
const cuentasPorCobrar = () => ventasActivas().map(v=>({venta:v, saldo:saldoDe(v)})).filter(x=>x.saldo>0);

/* ══════════════════════════════════════════════════════════
   PERIODOS Y MÉTRICAS
   ══════════════════════════════════════════════════════════ */
function rangoPeriodo(clave, custom){
  const h = new Date(); h.setHours(12,0,0,0);
  let desde, hasta = iso(h), etiqueta;
  if(clave==="hoy"){ desde=iso(h); etiqueta="Hoy"; }
  else if(clave==="semana"){ const d=new Date(h); d.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1)); desde=iso(d); etiqueta="Esta semana"; }
  else if(clave==="mes"){ desde=iso(new Date(h.getFullYear(),h.getMonth(),1)); etiqueta="Este mes"; }
  else {
    const m = new Date(h); m.setDate(m.getDate()-29);
    desde = custom&&custom.desde ? custom.desde : iso(m);
    hasta = custom&&custom.hasta ? custom.hasta : iso(h);
    etiqueta="Rango";
  }
  if(desde>hasta){ const t=desde; desde=hasta; hasta=t; }
  const dias = Math.round((new Date(hasta)-new Date(desde))/86400000)+1;
  const pd=new Date(desde), ph=new Date(desde);
  pd.setDate(pd.getDate()-dias); ph.setDate(ph.getDate()-1);
  return {desde, hasta, etiqueta, dias, previo:{desde:iso(pd), hasta:iso(ph)}};
}
const enRango = (f,d,h) => !!f && f>=d && f<=h;

function metricas(desde, hasta){
  const ventas = ventasActivas().filter(v=>enRango(v.soldAt,desde,hasta));
  const pagos  = D.payments.filter(p=>p.status==="active" && enRango(p.paidAt,desde,hasta));
  const gastos = D.expenses.filter(g=>g.status==="active" && enRango(g.date,desde,hasta));
  const tv = ventas.reduce((s,v)=>s+v.totalCents,0);
  const tc = ventas.reduce((s,v)=>s+v.costTotalCents,0);
  const bruta = tv-tc;
  const tg = gastos.reduce((s,g)=>s+g.amountCents,0);
  return {
    ventas:tv, nVentas:ventas.length,
    cobrado: pagos.reduce((s,p)=>s+p.amountCents,0),
    porCobrar: cuentasPorCobrar().reduce((s,x)=>s+x.saldo,0),
    porCobrarPeriodo: ventas.reduce((s,v)=>s+saldoDe(v),0),
    costo:tc, bruta, gastos:tg, neta:bruta-tg,
    margen: pctNum(bruta,tv),
    ticket: ventas.length ? Math.round(tv/ventas.length) : 0,
    sinCosto: ventas.some(v=>v.items.some(i=>i.costoDesconocido)),
    listaVentas:ventas, listaPagos:pagos, listaGastos:gastos
  };
}
const pedidosPendientes = () => D.orders.filter(p=>p.status==="pending"||p.status==="ready");

/* ══════════════════════════════════════════════════════════
   MIGRACIÓN DESDE LA VERSIÓN ANTERIOR (v1)
   ══════════════════════════════════════════════════════════ */
function migrarDeV1(viejo, base){
  const avisos=[];
  const pr = viejo.precios || {mayoreo:128, menudeo:160, req250:40, req500:50};
  base.products = catalogoInicial({mayoreo:aCent(pr.mayoreo), menudeo:aCent(pr.menudeo),
    req250:aCent(pr.req250), req500:aCent(pr.req500)});
  const porNombre={}; base.products.forEach(p=>porNombre[p.name]=p);

  base.customers = (viejo.clientes||[]).map(c=>{
    const f = typeof c==="string" ? {nombre:c} : c;
    return {id:uid("cli"), displayName:f.nombre||"Sin nombre", phone:f.telefono||"",
      deliveryAddress:f.direccion||"", lat:f.lat??null, lng:f.lng??null, mapsUrl:f.mapsUrl||"",
      defaultPriceTier: f.tarifa==="mayoreo"?"wholesale":"retail",
      legalName:"", rfc:"", fiscalZipCode:"", fiscalRegime:"", defaultCfdiUse:"", billingEmail:"",
      createdAt:ahora(), updatedAt:ahora()};
  });
  const porCliente={}; base.customers.forEach(c=>porCliente[c.displayName]=c);

  (viejo.pedidos||[]).forEach(p=>{
    const cli = porCliente[p.cliente]||null;
    const tier = p.tarifa==="mayoreo" ? "wholesale" : "retail";
    const items = (p.items||[]).map(i=>{
      const prod = porNombre[i.producto]||null;
      const gramos = Number(i.gramos)||0;
      if(prod && prod.porciones && i.tamano){
        const por = prod.porciones.find(x=>x.gramos===i.tamano)||prod.porciones[0];
        const n = Number(i.piezas)||1;
        return armarRenglon({productId:prod.id, nameSnapshot:i.producto, quantity:n, unit:"porción",
          unitPriceCents: tier==="wholesale"?por.wholesalePriceCents:por.retailPriceCents,
          unitCostCents:0, taxRate:0, gramos:n*i.tamano, piezas:n, tamano:i.tamano,
          stockUnits:(n*i.tamano)/1000, costoDesconocido:true});
      }
      return armarRenglon({productId:prod?prod.id:null, nameSnapshot:i.producto, quantity:gramos/1000, unit:"kg",
        unitPriceCents: prod ? precioDe(prod,tier) : 0, unitCostCents:0, taxRate:0,
        gramos, piezas:i.piezas||null, tamano:i.tamano||null,
        stockUnits:gramos/1000, costoDesconocido:true});
    });
    const t = sumaRenglones(items);
    const ped = {id:uid("ped"), folio:folioEn(base,"order","PED"),
      customerId:cli?cli.id:null, customerNameSnapshot:p.cliente||"Sin cliente", priceTier:tier, items,
      status: p.estado==="entregado"?"delivered":"pending",
      deliveryDate:p.fecha||HOY(), deliveredAt: p.estado==="entregado"?(p.creado||ahora()):null,
      packaging: p.empaque==="vacio"?"vacio":"normal", note:p.nota||"", cancellationReason:"", saleId:null,
      subtotalCents:t.subtotal, taxCents:t.tax, totalCents:t.subtotal+t.tax,
      createdAt:p.creado||ahora(), updatedAt:ahora()};
    base.orders.push(ped);
    if(ped.status==="delivered"){
      const v = ventaDesde(base, ped, {soldAt: soloFecha(ped.deliveredAt)||HOY()});
      base.sales.push(v); ped.saleId = v.id;
      if(p.pagado) base.payments.push({id:uid("pay"), saleId:v.id, amountCents:v.totalCents,
        method: p.formaPago==="tarjeta"?"card":"cash", reference:"",
        paidAt: soloFecha(ped.deliveredAt)||HOY(), note:"Migrado de la versión anterior", status:"active"});
    }
  });
  if(base.orders.length) avisos.push("Se migraron tus pedidos anteriores. No traían costo, así que su utilidad aparece marcada como desconocida.");
  return avisos;
}

function atencionLista(){
  const out=[];
  D.orders.filter(p=>(p.status==="pending"||p.status==="ready") && p.deliveryDate<=MANANA())

      abrir:()=>abrirDetallePedido(p.id)}));

function grafica(r){
  const n = Math.min(Math.max(r.dias,7), 14);
  const fin = new Date(r.hasta+"T12:00:00");
  const cubos=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(fin); d.setDate(d.getDate()-i);
    const f=iso(d);
    cubos.push({f,
      v: ventasActivas().filter(x=>x.soldAt===f).reduce((s,x)=>s+x.totalCents,0),
      g: D.expenses.filter(x=>x.status==="active"&&x.date===f).reduce((s,x)=>s+x.amountCents,0)});
  }
  const max = Math.max(1, ...cubos.map(c=>Math.max(c.v,c.g)));
  const W=340, H=150, base=H-22, paso=W/cubos.length;
  const an = Math.max(3, Math.min(14, paso/2-3));
  const barras = cubos.map((c,i)=>{
    const x = i*paso+paso/2;
    const hv = Math.max(c.v>0?4:2, c.v/max*(base-10));
    const hg = Math.max(c.g>0?4:2, c.g/max*(base-10));
    return `<rect x="${(x-an-1.5).toFixed(1)}" y="${(base-hv).toFixed(1)}" width="${an.toFixed(1)}" height="${hv.toFixed(1)}" rx="2.5" fill="#2E3238"/>
      <rect x="${(x+1.5).toFixed(1)}" y="${(base-hg).toFixed(1)}" width="${an.toFixed(1)}" height="${hg.toFixed(1)}" rx="2.5" fill="var(--oro)"/>
      <text x="${x.toFixed(1)}" y="${base+15}" font-size="10" fill="#8B919B" text-anchor="middle" font-weight="600">${diaSemana(c.f)}</text>`;
  }).join("");
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="Barras de ventas y gastos por día">${barras}</svg>`;
}

const nuevaCesta = () => ({tier:"retail", cesta:{}, busqueda:"", categoria:"Todas"});

function capInicial(p){
  if(p.porciones) return {modo:"porcion", piezas:1, tamano:p.porciones[0].gramos};
  if(esPorPeso(p)) return {modo:"piezas", piezas:1, tamano:500, gramos:500};
  return {modo:"unidad", cantidad:1};
}
const renglonesDe = est => Object.entries(est.cesta).map(([pid,cap])=>{
  const p = D.products.find(x=>x.id===pid);
  return p ? renglonDeProducto(p, est.tier, cap) : null;
}).filter(r=>r && r.quantity>0);
const totalDe = est => sumaRenglones(renglonesDe(est));

function pintarSelector(cont, est, alCambiar){

    .filter(p=>est.categoria==="Todas"||(p.category||"Otros")===est.categoria)
    .filter(p=>!q||p.name.toLowerCase().includes(q)||(p.sku||"").toLowerCase().includes(q));

  cont.innerHTML = `
    <div class="par" style="margin-bottom:12px">
      <button data-tier="retail" aria-pressed="${est.tier==="retail"}">Menudeo</button>
      <button data-tier="wholesale" aria-pressed="${est.tier==="wholesale"}">Mayoreo</button>
    </div>
    <input class="buscador" id="sel-q" placeholder="Buscar artículo…" value="${esc(est.busqueda)}" autocomplete="off">
    <div class="cintas">${cats.map(c=>`<button data-cat="${esc(c)}" aria-pressed="${est.categoria===c}">${esc(c)}</button>`).join("")}</div>
    ${lista.length? lista.map((p,i)=>filaProd(p,est,i)).join("")
      : vacio("Sin resultados","Revisa el catálogo en Más › Productos.")}`;

  cont.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>{ est.tier=b.dataset.tier; pintarSelector(cont,est,alCambiar); alCambiar(); });
  cont.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ est.categoria=b.dataset.cat; pintarSelector(cont,est,alCambiar); });
  const bq = cont.querySelector("#sel-q");
  bq.oninput = e=>{ const v=e.target.value; est.busqueda=v; pintarSelector(cont,est,alCambiar);

  lista.forEach((p,i)=>engancharProd(cont,p,i,est,alCambiar));

function filaProd(p, est, ix){
  const cap = est.cesta[p.id], on = !!cap, c = cap||capInicial(p);
  const precio = precioDe(p, est.tier, c.tamano);
  const r = on ? renglonDeProducto(p, est.tier, c) : null;
  const stockTxt = p.stock!=null ? `<small>${numBonito(p.stock)} ${UNI_CORTA[p.saleUnit]}</small>` : "";

  let ctrl="";
  if(p.porciones){
    ctrl = `<div class="medidas porc">${p.porciones.map(x=>`<button data-tam="${x.gramos}" aria-pressed="${c.tamano===x.gramos}">
        <b>${medida(x.gramos)}</b><i>${pesos(est.tier==="wholesale"&&x.wholesalePriceCents!=null?x.wholesalePriceCents:x.retailPriceCents)}</i></button>`).join("")}</div>
      <div class="cont"><button class="paso" data-menos>−</button>
        <input class="num" data-cant type="number" inputmode="numeric" step="1" min="1" value="${c.piezas||1}">
        <span class="uni-l">porciones</span><button class="paso" data-mas>+</button></div>`;
  } else if(esPorPeso(p)){
    ctrl = `<div class="modos">
        <button data-modo="piezas" aria-pressed="${c.modo==="piezas"}">Por piezas</button>
        <button data-modo="peso" aria-pressed="${c.modo==="peso"}">Peso exacto</button></div>
      <div data-caja="piezas" style="display:${c.modo==="piezas"?"flex":"none"};flex-direction:column;gap:10px">
        <div class="medidas">${TAMANOS.map(t=>`<button data-tam="${t}" aria-pressed="${c.tamano===t}">${medida(t)}</button>`).join("")}</div>
        <div class="cont"><button class="paso" data-menos-pz>−</button>
          <input class="num" data-pz type="number" inputmode="numeric" step="1" min="1" value="${c.piezas||1}">
          <span class="uni-l">pzas</span><button class="paso" data-mas-pz>+</button></div></div>
      <div data-caja="peso" style="display:${c.modo==="peso"?"flex":"none"};gap:7px;align-items:center">
        <button class="paso" data-menos-g>−</button>
        <input class="num" data-gr type="number" inputmode="numeric" step="50" min="0" value="${c.gramos||0}">
        <span class="uni-l">g</span><button class="paso" data-mas-g>+</button></div>`;
  } else {
    const paso = p.allowsFraction?"0.5":"1";
    ctrl = `<div class="cont"><button class="paso" data-menos>−</button>
      <input class="num" data-cant type="number" inputmode="${p.allowsFraction?"decimal":"numeric"}" step="${paso}" min="0" value="${c.cantidad||1}">
      <span class="uni-l">${UNI_CORTA[p.saleUnit]}</span><button class="paso" data-mas>+</button></div>`;
  }

  return `<div class="prod ${on?"on":""}" data-i="${ix}">
    <button class="prod-cab" data-toggle>
      <span class="punto-c" style="background:${p.color}"></span>
      <span class="nm">${esc(p.name)}</span>
      <span class="pz">${pesos(precio)}${esPorPeso(p)&&!p.porciones?"/kg":""}${stockTxt}</span>
      <span class="mas">${on?"✓":"+"}</span></button>
    <div class="cuerpo-p">${ctrl}
      ${p.costoDesconocido?`<div class="aviso oro" style="font-size:13px;padding:9px 11px">Costo desconocido: la utilidad de este artículo no es confiable.</div>`:""}
      <div class="equiv"><em data-eq>${r?textoRenglon(r):""}</em><b data-imp>${r?pesos(r.subtotalCents):""}</b></div>
      <div data-alerta></div>
    </div></div>`;
}

function engancharProd(cont, p, ix, est, alCambiar){
  const fila = cont.querySelector(`.prod[data-i="${ix}"]`); if(!fila) return;
  const cap = ()=>est.cesta[p.id];
  const eq=fila.querySelector("[data-eq]"), imp=fila.querySelector("[data-imp]"), al=fila.querySelector("[data-alerta]");

  const refrescarFila = ()=>{
    const c = cap();
    if(c){
      const r = renglonDeProducto(p, est.tier, c);
      eq.textContent = textoRenglon(r);
      imp.textContent = pesos(r.subtotalCents);
      al.innerHTML = (p.stock!=null && r.stockUnits > p.stock)
        ? `<div class="aviso rojo" style="font-size:13px;padding:9px 11px">Solo hay ${numBonito(p.stock)} ${UNI_CORTA[p.saleUnit]} en existencia.</div>` : "";
    } else { eq.textContent=""; imp.textContent=""; al.innerHTML=""; }
    fila.classList.toggle("on", !!c);
    fila.querySelector(".mas").textContent = c?"✓":"+";
    alCambiar();
  };
  const encender = ()=>{ if(!cap()) est.cesta[p.id]=capInicial(p); return cap(); };

  fila.querySelector("[data-toggle]").onclick = ()=>{
    if(cap()) delete est.cesta[p.id]; else encender();
    refrescarFila();
  };
  fila.querySelectorAll("[data-tam]").forEach(b=>b.onclick=()=>{
    const c = encender();
    fila.querySelectorAll("[data-tam]").forEach(o=>o.setAttribute("aria-pressed", o===b));
    c.tamano = Number(b.dataset.tam);
    if(c.modo==="piezas") c.gramos = (c.piezas||1)*c.tamano;
    refrescarFila();
  });
  fila.querySelectorAll("[data-modo]").forEach(b=>b.onclick=()=>{
    const c = encender();
    fila.querySelectorAll("[data-modo]").forEach(o=>o.setAttribute("aria-pressed", o===b));
    c.modo = b.dataset.modo;
    const pz = c.modo==="piezas";
    fila.querySelector('[data-caja="piezas"]').style.display = pz?"flex":"none";
    fila.querySelector('[data-caja="peso"]').style.display = pz?"none":"flex";
    if(pz) c.gramos = (c.piezas||1)*(c.tamano||500);
    else { const g=fila.querySelector("[data-gr]"); if(g) g.value = c.gramos||0; }
    refrescarFila();
  });
  const pz=fila.querySelector("[data-pz]"), gr=fila.querySelector("[data-gr]"), ct=fila.querySelector("[data-cant]");
  if(pz){
    const set = v=>{ const c=encender(); c.piezas=Math.max(1,Math.round(v)); pz.value=c.piezas;
      c.gramos=c.piezas*(c.tamano||500); refrescarFila(); };
    fila.querySelector("[data-mas-pz]").onclick = ()=>set((Number(pz.value)||0)+1);
    fila.querySelector("[data-menos-pz]").onclick = ()=>set((Number(pz.value)||1)-1);
    pz.oninput = ()=>{ const c=encender(); c.piezas=Math.max(1,Number(pz.value)||1); c.gramos=c.piezas*(c.tamano||500); refrescarFila(); };
    pz.onfocus = ()=>{ encender(); refrescarFila(); };
  }
  if(gr){
    const set = v=>{ const c=encender(); c.gramos=Math.max(0,Math.round(v)); gr.value=c.gramos; refrescarFila(); };
    fila.querySelector("[data-mas-g]").onclick = ()=>set((Number(gr.value)||0)+SALTO);
    fila.querySelector("[data-menos-g]").onclick = ()=>set((Number(gr.value)||0)-SALTO);
    gr.oninput = ()=>{ const c=encender(); c.gramos=Math.max(0,Number(gr.value)||0); refrescarFila(); };
    gr.onfocus = ()=>{ encender(); refrescarFila(); };
  }
  if(ct){
    const inc = p.porciones?1:(p.allowsFraction?0.5:1);
    const set = v=>{ const c=encender(); const n=Math.max(inc, Math.round(v*100)/100);
      if(p.porciones) c.piezas=Math.max(1,Math.round(n)); else c.cantidad=n;
      ct.value = p.porciones?c.piezas:c.cantidad; refrescarFila(); };
    fila.querySelector("[data-mas]").onclick = ()=>set((Number(ct.value)||0)+inc);
    fila.querySelector("[data-menos]").onclick = ()=>set((Number(ct.value)||inc)-inc);
    ct.oninput = ()=>{ const c=encender(); const n=Math.max(0,Number(ct.value)||0);
      if(p.porciones) c.piezas=Math.max(1,Math.round(n)); else c.cantidad=n; refrescarFila(); };
    ct.onfocus = ()=>{ encender(); refrescarFila(); };
  }
  refrescarFila();
}

function bloqueRenglones(items, o={}){
  const t = sumaRenglones(items);
  const desc = o.discountCents||0;
  const total = t.subtotal - desc + t.tax;
  const colorDe = id => (D.products.find(p=>p.id===id)||{}).color || "#DFDACE";
  return `<ul class="res-lista">
      ${items.map(i=>`<li><span class="punto-c" style="background:${colorDe(i.productId)};margin-top:7px"></span>
        <span class="nm">${esc(i.nameSnapshot)}<span class="dt">${esc(detalleRenglon(i))}</span></span>
        <b>${pesos(i.subtotalCents)}</b></li>`).join("")}
    </ul>
    <div class="lin"><span>Subtotal</span><b>${pesos(t.subtotal)}</b></div>
    ${desc?`<div class="lin"><span>Descuento</span><b>−${pesos(desc)}</b></div>`:""}
    ${t.tax?`<div class="lin"><span>IVA</span><b>${pesos(t.tax)}</b></div>`:""}
    <div class="lin total"><span>Total</span><b>${pesos(total)}</b></div>
    ${o.margen===false?"":`<div class="margen">
      <span>Costo ${pesos(t.costo)}</span>
      <span>Utilidad <b>${pesos(t.subtotal-desc-t.costo)}</b></span>
      <span>Margen <b>${(t.subtotal-desc)?pct(t.subtotal-desc-t.costo, t.subtotal-desc):"—"}</b></span></div>`}

const clientePorId = id => D.customers.find(c=>c.id===id) || null;
const normaliza = s => String(s||"").trim().replace(/\s+/g," ").toLowerCase();
const clientePorNombre = n => D.customers.find(c=>normaliza(c.displayName)===normaliza(n)) || null;
function telWhats(t){
  const d = String(t||"").replace(/\D/g,"");
  if(d.length===10) return "521"+d;
  if(d.length===12 && d.startsWith("52")) return "521"+d.slice(2);
  if(d.length===13 && d.startsWith("521")) return d;
  return "";
}
function linkMapa(c){
  if(!c) return "";
  if(c.mapsUrl) return c.mapsUrl;
  if(c.lat!=null && c.lng!=null) return `https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}`;
  if(c.deliveryAddress) return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(c.deliveryAddress)}`;
  return "";
}
function fichaCliente(o={}){
  return Object.assign({id:uid("cli"), displayName:"", phone:"", deliveryAddress:"", lat:null, lng:null,
    mapsUrl:"", defaultPriceTier:"retail", legalName:"", rfc:"", fiscalZipCode:"", fiscalRegime:"",
    defaultCfdiUse:"", billingEmail:"", createdAt:ahora(), updatedAt:ahora()}, o);
}
function altaClienteRapida(nombre, tier){
  const ex = clientePorNombre(nombre);
  if(ex) return ex;
  const c = fichaCliente({displayName:String(nombre).trim(), defaultPriceTier:tier||"retail"});

}

let bor=null, pasoBor=1;
const PASOS=4;

function abrirCapturaPedido(id, prefill){
  const p = id ? D.orders.find(x=>x.id===id) : null;
  const fotoEscaneo = prefill && prefill.foto || null;
  const avisoEscaneo = prefill && prefill.avisoRevision || null;
  bor = {editando:p?p.id:null, customerId:p?p.customerId:((prefill&&prefill.customerId)||null),
    nombre:p?p.customerNameSnapshot:((prefill&&prefill.nombre)||""),
    est:nuevaCesta(), packaging:p?p.packaging:((prefill&&prefill.packaging)||"normal"),
    deliveryDate:p?p.deliveryDate:((prefill&&prefill.deliveryDate)||HOY()),
    note:p?p.note:((prefill&&prefill.note)||""),
    clienteSugerido: (prefill && prefill.clienteSugerido) || null,
    fotoEscaneo, avisoEscaneo};
  if(!p && bor.customerId){
    const cl = clientePorId(bor.customerId);
    if(cl) bor.est.tier = cl.defaultPriceTier || "retail";
  }
  if(p){
    bor.est.tier = p.priceTier||"retail";
    p.items.forEach(i=>{
      if(!i.productId) return;
      const prod = D.products.find(x=>x.id===i.productId); if(!prod) return;
      bor.est.cesta[i.productId] = i.unit==="porción" ? {modo:"porcion", piezas:i.piezas||1, tamano:i.tamano}
        : i.unit==="kg" ? (i.piezas ? {modo:"piezas", piezas:i.piezas, tamano:i.tamano, gramos:i.gramos}
                                    : {modo:"peso", gramos:i.gramos})
        : {modo:"unidad", cantidad:i.quantity};
    });
  } else if(prefill && prefill.matches && prefill.matches.length){
    prefill.matches.forEach(m=>{ bor.est.cesta[m.productId] = m.cap; });
  }
  pasoBor=1;
  abrirHoja({titulo:p?"Editar pedido":"Nuevo pedido", pie:true, render:f=>{
    f.pie.innerHTML = `<div class="barra-t" id="bt" style="display:none"><span>Total aprox.</span><b id="bt-n">$0</b></div>
      <button class="btn" id="ir-sig">Siguiente</button>
      <div class="tres" id="acc-final" style="display:none">
        <button class="btn" id="ac-ok">${bor.editando?"Confirmar cambios":"Confirmar pedido"}</button>
        <button class="btn claro" id="ac-edit">Editar pedido</button>
        <button class="btn claro" id="ac-cancel" style="color:var(--rojo)">Cancelar pedido</button>
      </div>`;
    $("ir-sig").onclick = avanzarPedido;
    $("ac-ok").onclick = avanzarPedido;
    $("ac-edit").onclick = ()=>{ pasoBor=2; pintarPasoPedido(); };
    $("ac-cancel").onclick = ()=>{ if(confirm("¿Descartar este pedido?")) cerrarHoja(); };
    f.cfg.alVolver = ()=>{ if(pasoBor>1){ pasoBor--; pintarPasoPedido(); } else cerrarHoja(); };
    pintarPasoPedido();
  }});
}
function pintarPasoPedido(){
  const f = hojaActual(); if(!f) return;
  f.pasos.innerHTML = Array.from({length:PASOS},(_,i)=>`<span class="pt ${i<pasoBor?"on":""}"></span>`).join("");
  const c = f.cuerpo; c.scrollTop=0;
  $("ir-sig").textContent = "Siguiente";
  $("ir-sig").style.display = pasoBor===PASOS ? "none" : "";
  $("acc-final").style.display = pasoBor===PASOS ? "flex" : "none";

  const bloqueFotoAviso =
    (bor.avisoEscaneo && bor.avisoEscaneo.length?`<div class="aviso rojo" style="margin-bottom:14px"><b>Revisa antes de guardar:</b><br>${bor.avisoEscaneo.map(esc).join("<br>")}</div>`:"")
    + (bor.fotoEscaneo?`<img src="data:${bor.fotoEscaneo.mediaType};base64,${bor.fotoEscaneo.base64}" alt="Nota escaneada" style="width:100%;max-height:220px;object-fit:contain;border-radius:12px;margin-bottom:14px;background:#00000008">`:"");

  if(pasoBor===1){
    c.innerHTML = `${bloqueFotoAviso}<h2 class="pregunta">¿Para quién es?</h2>
      <p class="ayuda">Toca un cliente${hayAgenda()?", tráelo de tu agenda":""} o escribe uno nuevo.</p>
      ${hayAgenda()?`<div class="import"><div><strong>Traer de mi agenda</strong>
          <span>Escoge el contacto y se llena solo.</span></div>
        <button id="ped-agenda">Agenda</button></div>`:""}
      <input class="txt" id="cli-q" placeholder="Nombre del cliente" value="${esc(bor.nombre)}" autocomplete="off">
      ${bor.clienteSugerido && !bor.customerId?`<button class="op col" id="cli-sug" style="margin-top:8px;border-color:var(--oro)">
          <strong>Cliente sugerido: ${esc(bor.clienteSugerido.cliente.displayName)}</strong>
          <span class="men">${bor.clienteSugerido.porcentaje}% de coincidencia — toca para usarlo</span></button>`
        : (!bor.customerId && bor.nombre.trim() && !clientePorNombre(bor.nombre) ?
          `<p class="pista" style="margin-top:6px">No encontré este cliente — se creará "${esc(bor.nombre.trim())}" al confirmar.</p>` : "")}
      <div class="opciones" style="margin-top:12px" id="cli-lista"></div>`;
    const bSug = $("cli-sug");
    if(bSug) bSug.onclick = ()=>{
      const cl = bor.clienteSugerido.cliente;
      bor.customerId=cl.id; bor.nombre=cl.displayName; bor.est.tier=cl.defaultPriceTier||"retail";
      bor.clienteSugerido=null;
      pintarPasoPedido();
    };
    const bAg = $("ped-agenda");
    if(bAg) bAg.onclick = ()=>traerDeAgenda(({nombre,tel})=>{
      if(!nombre) return;
      const ex = clientePorNombre(nombre);
      if(ex){ bor.customerId=ex.id; bor.nombre=ex.displayName; bor.est.tier=ex.defaultPriceTier||"retail"; }
      else { const nc = altaClienteRapida(nombre, bor.est.tier); if(tel){ nc.phone=tel; nc.updatedAt=ahora(); }
             bor.customerId=nc.id; bor.nombre=nc.displayName; guardar(); }
      $("cli-q").value = bor.nombre;
      lista(); validarPedido();
      aviso("Cliente traído de la agenda","ok");
    });
    const lista = ()=>{
      const q = normaliza($("cli-q").value);
      $("cli-lista").innerHTML = D.customers.filter(cl=>!q||normaliza(cl.displayName).includes(q)).slice(0,40)
        .map(cl=>`<button class="op col" data-cli="${cl.id}" aria-pressed="${cl.id===bor.customerId}">
          <span style="display:flex;width:100%;align-items:center;gap:10px">${esc(cl.displayName)}
            <span class="etq" style="margin-left:auto">${cl.defaultPriceTier==="wholesale"?"mayoreo":"menudeo"}</span></span>
          ${cl.deliveryAddress?`<span class="men">${esc(cl.deliveryAddress)}</span>`:""}</button>`).join("");
      $("cli-lista").querySelectorAll("[data-cli]").forEach(b=>b.onclick=()=>{
        const cl = clientePorId(b.dataset.cli);
        bor.customerId=cl.id; bor.nombre=cl.displayName; bor.est.tier=cl.defaultPriceTier||"retail";
        $("cli-q").value=cl.displayName; lista(); validarPedido();
      });
    };
    $("cli-q").oninput = e=>{ bor.nombre=e.target.value; bor.customerId=null;
      if(bor.clienteSugerido){ bor.clienteSugerido=null; const s=$("cli-sug"); if(s) s.remove(); }
      lista(); validarPedido(); };
    lista();
  }
  if(pasoBor===2){
    c.innerHTML = `${bloqueFotoAviso}<h2 class="pregunta">¿Qué lleva?</h2>
      <p class="ayuda">Precio según la tarifa del cliente.</p><div id="sel"></div>`;
    pintarSelector($("sel"), bor.est, validarPedido);
  }
  if(pasoBor===3){
    c.innerHTML = `${bloqueFotoAviso}<h2 class="pregunta">Entrega</h2>
      <p class="ayuda">Fecha y detalles.</p>
      <div class="campo"><label>¿Para cuándo?</label>
        <div class="par"><button data-f="hoy" aria-pressed="${bor.deliveryDate===HOY()}">Hoy</button>
          <button data-f="manana" aria-pressed="${bor.deliveryDate===MANANA()}">Mañana</button></div>
        <input class="txt" type="date" id="f-otro" style="margin-top:9px" value="${bor.deliveryDate}"></div>

        <textarea class="txt" id="f-nota" rows="2" placeholder="Ej. entregar en la tienda, sin sal…">${esc(bor.note)}</textarea></div>`;
    c.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
      bor.deliveryDate = b.dataset.f==="hoy"?HOY():MANANA();
      $("f-otro").value = bor.deliveryDate;
      c.querySelectorAll("[data-f]").forEach(o=>o.setAttribute("aria-pressed", o===b)); });
    $("f-otro").onchange = e=>{ if(e.target.value){ bor.deliveryDate=e.target.value;
      c.querySelectorAll("[data-f]").forEach(o=>o.setAttribute("aria-pressed","false")); } };
    $("f-nota").oninput = e=>bor.note=e.target.value;
  }
  if(pasoBor===PASOS){
    const items = renglonesDe(bor.est);
    c.innerHTML = `${bloqueFotoAviso}<h2 class="pregunta">¿Todo bien?</h2><p class="ayuda">Revisa antes de guardar.</p>
      <div class="res">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="flex:1"><div class="res-nom">${esc(bor.nombre)}</div>
            <div class="res-sub">${fechaLarga(bor.deliveryDate)} · ${bor.est.tier==="wholesale"?"mayoreo":"menudeo"}</div></div>
          <span class="sello ${bor.packaging==="vacio"?"v":""}">${bor.packaging==="vacio"?"Al vacío":"Envoltura"}</span></div>
        ${bloqueRenglones(items)}
        ${bor.note?`<p style="margin:11px 0 0;color:var(--tinta-70)">📝 ${esc(bor.note)}</p>`:""}
      </div>
      <div class="aviso">El peso final se confirma al entregar. Ahí se genera la venta y se descuenta el inventario.</div>`;
  }
  validarPedido();
}
function validarPedido(){
  const b = $("ir-sig"); if(!b) return;
  let ok=true;
  if(pasoBor===1) ok = !!bor.nombre.trim();
  if(pasoBor===2) ok = renglonesDe(bor.est).length>0;
  if(pasoBor===3) ok = !!bor.deliveryDate;
  b.disabled = !ok;
  const bt = $("bt");
  if(bt){
    const ver = pasoBor===2 && renglonesDe(bor.est).length>0;
    bt.style.display = ver?"flex":"none";
    if(ver){ const t=totalDe(bor.est); $("bt-n").textContent = pesos(t.subtotal+t.tax); }
  }
}
async function avanzarPedido(){
  if(pasoBor<PASOS){ pasoBor++; pintarPasoPedido(); return; }
  const items = renglonesDe(bor.est), t = sumaRenglones(items);
  const cli = bor.customerId ? clientePorId(bor.customerId) : altaClienteRapida(bor.nombre, bor.est.tier);
  const campos = {customerId:cli?cli.id:null, customerNameSnapshot:bor.nombre.trim(),
    priceTier:bor.est.tier, items, deliveryDate:bor.deliveryDate, packaging:bor.packaging, note:bor.note,
    subtotalCents:t.subtotal, taxCents:t.tax, totalCents:t.subtotal+t.tax, updatedAt:ahora()};
  let ped;
  if(bor.editando){
    ped = D.orders.find(x=>x.id===bor.editando);
    if(!ped) return;
    if(ped.saleId){ aviso("Este pedido ya se convirtió en venta. Edita la venta, no el pedido.","err"); return; }
    const nuevos = campos.items;
    delete campos.items;
    reajustarStock(D, ped, nuevos, "ajuste de pedido");
    Object.assign(ped, campos);
  } else {
    ped = Object.assign({id:uid("ped"), folio:folio("order","PED"), status:"pending",
      deliveredAt:null, cancellationReason:"", saleId:null, stockAplicado:false, createdAt:ahora()}, campos);
    D.orders.push(ped);
    aplicarStock(D, ped, "pedido");     // el inventario se aparta desde ahora
  }
  await guardar();
  cerrarHoja();
  irA("inicio");
  pantallaConfirmado({
    titulo: bor.editando ? "Pedido actualizado" : "Pedido confirmado",
    sub: `${ped.folio} · ${esc(ped.customerNameSnapshot)} · ${fechaLarga(ped.deliveryDate)}`,
    op: ped, whatsapp: true
  });
}

/* ══════════════════════════════════════════════════════════
   INICIO · el pedido es lo primero
   ══════════════════════════════════════════════════════════ */
let tabPed="pending";
function pintarInicio(){
  const grupos = {pending:"Por entregar", delivered:"Entregados", cancelled:"Cancelados"};
  const l = D.orders.filter(p=> tabPed==="pending" ? (p.status==="pending"||p.status==="ready") : p.status===tabPed)
                    .sort((a,b)=>(a.deliveryDate||"").localeCompare(b.deliveryDate||""));
  const hoy = D.orders.filter(p=>(p.status==="pending"||p.status==="ready") && p.deliveryDate<=HOY()).length;
  const deben = cuentasPorCobrar();
  let html="";
  if(!l.length){
    html = vacio(tabPed==="pending"?"No hay pedidos por entregar":"Nada por aquí",
      tabPed==="pending"?"Toca el botón de arriba para levantar el primero.":"Aparecerán aquí conforme avancen.");
  } else if(tabPed==="pending"){
    [["Atrasados",p=>p.deliveryDate<HOY(),"tarde"],["Hoy",p=>p.deliveryDate===HOY(),""],
     ["Mañana",p=>p.deliveryDate===MANANA(),""],["Próximos",p=>p.deliveryDate>MANANA(),""]].forEach(([t,fn,cl])=>{
      const g = l.filter(fn);
      if(g.length) html += `<p class="grupo ${cl}">${t}</p>`+g.map(filaPedido).join("");
    });
  } else html = l.slice().reverse().map(filaPedido).join("");

  $("v-inicio").innerHTML = `
    <h1 class="saludo">${saludo()}</h1>
    <p class="saludo-s">${hoy ? `Tienes ${hoy} pedido${hoy===1?"":"s"} para hoy` : "No hay pedidos pendientes para hoy"}</p>
    <button class="btn destacado" id="nuevo-ped">+ Nuevo pedido</button>
    ${avisoRespaldo()}
    ${deben.length?`<button class="fila borde deb" id="ir-deben" style="margin-bottom:14px">
      <div class="f-top"><span class="f-nom">Te deben ${pesos(deben.reduce((s,x)=>s+x.saldo,0))}</span><span class="flecha">›</span></div>
      <div class="f-det">${deben.length} venta${deben.length===1?"":"s"} sin cobrar</div></button>`:""}
    ${bloquePreparacion()}
    <div class="periodo">${Object.entries(grupos).map(([k,t])=>
      `<button data-t="${k}" aria-pressed="${tabPed===k}">${t}</button>`).join("")}</div>
    ${html}`;
  $("nuevo-ped").onclick = ()=>abrirCapturaPedido(null);
  const dd = $("ir-deben"); if(dd) dd.onclick = abrirCuentasPorCobrar;
  const rp = $("ir-respaldo"); if(rp) rp.onclick = crearRespaldo;
  $("v-inicio").querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>abrirPreparacion(Number(b.dataset.prep)));
  $("v-inicio").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ tabPed=b.dataset.t; pintarInicio(); });
  $("v-inicio").querySelectorAll("[data-ped]").forEach(b=>b.onclick=()=>abrirDetallePedido(b.dataset.ped));
}
function diasDePreparacion(){
  const dias = [["Hoy", HOY()], ["Mañana", MANANA()]].map(([t,f])=>({
    t, f, ped: D.orders.filter(p=>(p.status==="pending"||p.status==="ready") && p.deliveryDate===f)
  })).filter(d=>d.ped.length);
  const tarde = D.orders.filter(p=>(p.status==="pending"||p.status==="ready") && p.deliveryDate<HOY());
  if(tarde.length) dias.unshift({t:"Atrasado", f:null, ped:tarde, tarde:true});
  return dias;
}
function totalesDe(ped){
  const s={};
  ped.forEach(p=>p.items.forEach(i=>{
    const k=i.nameSnapshot;
    s[k]=s[k]||{gr:0,uds:0,color:(D.products.find(x=>x.id===i.productId)||{}).color||"#DFDACE"};
    if(i.unit==="kg"||i.unit==="porción") s[k].gr += (i.gramos||0); else s[k].uds += i.quantity;
  }));
  return Object.entries(s).map(([n,v])=>{
    const [c,u] = v.gr>0 ? pesoBonito(v.gr) : [numBonito(v.uds), "pzas"];
    return {n, c, u, color:v.color};
  });
}
/* En la portada solo va una tira por día. El desglose vive en su propia pantalla. */
function bloquePreparacion(){
  const dias = diasDePreparacion();
  if(!dias.length) return "";
  return dias.map((d,ix)=>{
    const kg = d.ped.reduce((a,p)=>a+p.items.reduce((b,i)=>b+((i.unit==="kg"||i.unit==="porción")?(i.gramos||0):0),0),0);
    return `<button class="fila borde ${d.tarde?"deb":""}" data-prep="${ix}" style="margin-bottom:9px">
      <div class="f-top">
        <span style="flex:1">
          <span class="f-nom" style="display:block">${d.t}${d.f&&d.f!==HOY()?` · ${fechaCorta(d.f)}`:""}</span>
          <span class="f-det" style="margin:0">${d.ped.length} pedido${d.ped.length===1?"":"s"}${kg?` · ${peso(kg)} en total`:""}</span>
        </span>
        <span class="etq grande ${d.tarde?"rojo":"oro"}">PREPARAR</span>
        <span class="flecha">›</span></div></button>`;
  }).join("");
}

          <span class="n">${esc(i.nameSnapshot)}</span>
          <span class="c">${i.unit==="kg"||i.unit==="porción" ? pesoBonito(i.gramos)[0] : numBonito(i.quantity)}</span>

      </div>`).join("")}`;
    f.cuerpo.querySelectorAll("[data-ver]").forEach(b=>b.onclick=()=>abrirDetallePedido(b.dataset.ver));
  }});
}

function filaPedido(p){
  const v = p.packaging==="vacio", ep = estadoPagoPedido(p), can = p.status==="cancelled";

          <div class="res-sub">${p.folio} · ${fechaLarga(p.deliveryDate)} · ${p.priceTier==="wholesale"?"mayoreo":"menudeo"}</div></div>
        <span class="sello ${p.packaging==="vacio"?"v":""}">${p.packaging==="vacio"?"Al vacío":"Envoltura"}</span></div>
